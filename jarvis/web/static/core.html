<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000306">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* One screen: the holographic core. You talk; he acts. Results, approvals and media appear as
   holographic panels beside the core and fade away. Everything else runs in the background. */
:root {
  --bg: #000306;
  --holo: #49d7ff;
  --holo-2: #b4f6ff;
  --holo-dim: rgba(73, 215, 255, .55);
  --line: rgba(73, 215, 255, .28);
  --amber: #ffb547;
  --red: #ff5d6c;
  --ink: #dff6ff;
  --font-hud: "Orbitron", "Chakra Petch", ui-sans-serif, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, .75) 100%); }
.scan { position: fixed; inset: 0; pointer-events: none; opacity: .5; background: repeating-linear-gradient(0deg, rgba(73, 215, 255, .035) 0 1px, transparent 1px 3px); }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--holo); outline-offset: 3px; }

/* hud corners */
.hud-top { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 18px; right: 18px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .22em; color: var(--holo-dim); text-transform: uppercase; }
.brand { font-family: var(--font-hud); font-weight: 700; font-size: 14px; letter-spacing: .5em; color: var(--holo-2); text-shadow: 0 0 12px rgba(73, 215, 255, .7); }
.hud-top .r { text-align: right; }
.hud-top .clock { font-family: var(--font-hud); font-size: 15px; letter-spacing: .2em; color: var(--holo-2); }

/* state under the core */
.state { position: fixed; left: 0; right: 0; top: calc(50% + var(--cy, 0px) + var(--r, 220px)); transform: translateX(var(--cx, 0px)); text-align: center; pointer-events: none; transition: opacity .4s; }
.state .s1 { font-family: var(--font-hud); font-size: 13px; letter-spacing: .5em; padding-left: .5em; color: var(--holo-2); text-shadow: 0 0 10px rgba(73, 215, 255, .8); }
.state .s2 { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--holo-dim); margin-top: 6px; min-height: 18px; }
body.subs-on .state .s2 { opacity: 0; }
.state .s2 { transition: opacity .4s; }
body.alert .state .s1 { color: var(--amber); text-shadow: 0 0 10px rgba(255, 181, 71, .8); }

/* operation tags that fly in around the core */
.ops { position: fixed; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: min(300px, 30vw); }
.ops { top: calc(50% + var(--cy, 0px)); }
.ops.left { right: calc(50% - var(--cx, 0px) + var(--r, 220px) + 24px); align-items: flex-end; }
.ops.right { left: calc(50% + var(--cx, 0px) + var(--r, 220px) + 24px); align-items: flex-start; }
.tag { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--holo-2); padding: 6px 12px; border: 1px solid var(--line); background: linear-gradient(90deg, rgba(73, 215, 255, .12), rgba(73, 215, 255, .02)); position: relative; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; animation: tagIn .45s cubic-bezier(.2, .9, .2, 1) both; }
.ops.left .tag { animation-name: tagInL; }
.tag::after { content: ""; position: absolute; top: 50%; width: 36px; height: 1px; background: var(--line); }
.ops.left .tag::after { left: 100%; } .ops.right .tag::after { right: 100%; }
.tag .ic { display: inline-block; margin-right: 8px; color: var(--holo); }
.tag.run .ic { animation: spin 1s linear infinite; }
.tag.ok { color: var(--holo-dim); } .tag.ok .ic { color: #4cf2a8; }
.tag.err .ic { color: var(--red); }
.tag .ms { margin-left: 10px; color: var(--holo-dim); }
.tag.out { animation: tagOut .6s ease both; }
@keyframes tagIn { from { opacity: 0; transform: translateX(40px) scaleX(.6); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes tagInL { from { opacity: 0; transform: translateX(-40px) scaleX(.6); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes tagOut { to { opacity: 0; transform: scale(.9); filter: blur(6px); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* subtitles */
.subs { position: fixed; left: 50%; transform: translateX(calc(-50% + var(--cx, 0px))); bottom: calc(86px + env(safe-area-inset-bottom)); width: min(860px, calc(100% - 36px)); text-align: center; pointer-events: none; transition: opacity 1.2s; }
.subs .you { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--holo-dim); text-transform: uppercase; margin-bottom: 8px; }
.subs .him { font-size: clamp(17px, 2.1vw, 22px); line-height: 1.45; color: var(--ink); text-shadow: 0 0 18px rgba(73, 215, 255, .35); text-wrap: balance; }
.subs.fade { opacity: 0; }

/* holographic panel */
#panels { position: fixed; z-index: 10; right: clamp(16px, 3vw, 48px); top: 50%; transform: translateY(-50%); width: min(520px, 40vw); max-height: 80vh; display: flex; flex-direction: column; gap: 14px; pointer-events: none; }
.panel { position: relative; pointer-events: auto; max-height: 64vh; min-height: 0; flex-shrink: 1; display: flex; flex-direction: column;
  border: 1px solid var(--line); background: linear-gradient(160deg, rgba(10, 40, 60, .62), rgba(2, 12, 20, .78)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 0 40px rgba(73, 215, 255, .15), inset 0 0 30px rgba(73, 215, 255, .06); clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  animation: panelIn .55s cubic-bezier(.2, .9, .2, 1) both; }
.panel.amber { border-color: rgba(255, 181, 71, .55); background: linear-gradient(160deg, rgba(60, 40, 10, .6), rgba(20, 12, 2, .8)); box-shadow: 0 0 50px rgba(255, 181, 71, .2); }
.panel.out { animation: panelOut .5s ease both; }
@keyframes panelIn { from { opacity: 0; transform: perspective(900px) rotateY(-28deg) translateX(60px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes panelOut { to { opacity: 0; transform: perspective(900px) rotateY(20deg) translateX(40px); filter: blur(6px); } }
.panel .ph { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--holo); }
.panel.amber .ph { color: var(--amber); }
.panel .ph .x { margin-left: auto; background: none; border: 0; color: var(--holo-dim); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; }
.panel .pb { padding: 4px 16px 16px; overflow-y: auto; min-height: 0; }
.panel .bar { height: 2px; margin: 0 16px; background: linear-gradient(90deg, var(--holo), transparent); opacity: .7; }
.panel.amber .bar { background: linear-gradient(90deg, var(--amber), transparent); }
.panel .what { font-family: var(--font-mono); font-size: 13px; padding: 10px 12px; border: 1px solid rgba(255, 181, 71, .35); background: rgba(0, 0, 0, .3); margin: 6px 0 14px; overflow-wrap: anywhere; }
.panel .btns { display: flex; gap: 10px; justify-content: flex-end; }
.hbtn { font-family: var(--font-hud); font-size: 12px; letter-spacing: .2em; padding: 9px 16px; border: 1px solid var(--line); background: rgba(73, 215, 255, .08); color: var(--holo-2); cursor: pointer; text-transform: uppercase; }
.hbtn:hover { background: rgba(73, 215, 255, .2); box-shadow: 0 0 16px rgba(73, 215, 255, .3); }
.hbtn.go { border-color: var(--amber); color: #1b1000; background: var(--amber); box-shadow: 0 0 20px rgba(255, 181, 71, .45); }
.hbtn.no { border-color: rgba(255, 93, 108, .5); color: var(--red); background: rgba(255, 93, 108, .06); }
.md { font-size: 14.5px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md h2, .md h3, .md h4 { font-family: var(--font-hud); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--holo); margin: 12px 0 6px; }
.md code { font-family: var(--font-mono); font-size: 13px; background: rgba(73, 215, 255, .1); padding: 1px 5px; }
.md pre { background: rgba(0, 0, 0, .35); border: 1px solid var(--line); padding: 10px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; width: 100%; margin-bottom: 10px; display: block; overflow-x: auto; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; font-variant-numeric: tabular-nums; }
.md th { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--holo); }
.md strong { color: var(--holo-2); }
.md a { color: var(--holo); }
.panel img, .panel video, .panel iframe { width: 100%; display: block; border: 1px solid var(--line); }
.panel iframe { aspect-ratio: 16 / 9; border: 0; }
.panel audio { width: 100%; }

/* type bar */
.typebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom)); width: min(680px, calc(100% - 120px)); display: flex; gap: 8px; animation: tagIn .3s both; }
.typebar input { flex: 1; background: rgba(0, 10, 18, .75); border: 1px solid var(--line); padding: 12px 14px; outline: none; font-size: 15px; backdrop-filter: blur(6px); }
.typebar input:focus { border-color: var(--holo); box-shadow: 0 0 20px rgba(73, 215, 255, .25); }

/* discreet corner controls */
.dock { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 6px; opacity: .45; transition: opacity .2s; }
.dock:hover, .dock:focus-within { opacity: 1; }
.dock.l { left: 16px; } .dock.r { right: 16px; }
.dock button, .dock a { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); background: rgba(0, 10, 18, .6); color: var(--holo-2); cursor: pointer; text-decoration: none; }
.dock svg { width: 18px; height: 18px; }
.dock .on { box-shadow: inset 0 0 0 1px var(--holo), 0 0 12px rgba(73, 215, 255, .35); }

/* boot / login */
.boot { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at center, rgba(0, 20, 32, .55), rgba(0, 3, 6, .96) 70%); }
.boot .brand { font-size: clamp(26px, 5vw, 44px); letter-spacing: .6em; padding-left: .6em; }
.boot .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .3em; color: var(--holo-dim); text-transform: uppercase; margin: 14px 0 28px; }
.boot form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.boot input { width: min(300px, 80vw); text-align: center; letter-spacing: .3em; background: rgba(0, 10, 18, .8); border: 1px solid var(--line); padding: 12px; outline: none; }
.boot .err { color: var(--red); font-size: 13px; min-height: 20px; font-family: var(--font-mono); }
.demo { position: fixed; top: calc(40px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; color: var(--amber); text-transform: uppercase; opacity: .8; pointer-events: none; white-space: nowrap; }

@media (max-width: 820px) {
  .ops { display: none; }
  #panels { left: 12px; right: 12px; width: auto; top: auto; bottom: calc(76px + env(safe-area-inset-bottom)); transform: none; max-height: 54vh; gap: 10px; }
  .panel { max-height: 54vh; animation-name: sheetIn; }
  body.panel-open .state { opacity: 0; }
  .demo { top: auto; bottom: calc(26px + env(safe-area-inset-bottom)); }
  .panel.out { animation-name: sheetOut; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(40px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes sheetOut { to { opacity: 0; transform: translateY(30px); } }
  body.panel-open .subs { opacity: 0; }
  .subs { bottom: calc(80px + env(safe-area-inset-bottom)); }
  .typebar { width: calc(100% - 120px); }
  .hud-top .hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>

<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="vignette"></div><div class="scan"></div>

<div class="hud-top">
  <div><div class="brand">JARVIS</div><div style="margin-top:6px" id="sys">SYSTEMS ONLINE</div></div>
  <div class="r"><div class="clock" id="clock">--:--</div><div style="margin-top:6px" class="hide-sm" id="date"></div></div>
</div>
<div class="demo hidden" id="demo-note">Demo · sample data</div>

<div class="ops left" id="ops-l" aria-hidden="true"></div>
<div class="ops right" id="ops-r" aria-hidden="true"></div>

<div class="state" aria-live="polite"><div class="s1" id="s1">STANDING BY</div><div class="s2" id="s2"></div></div>
<div class="subs fade" id="subs" aria-live="polite"><div class="you" id="you"></div><div class="him" id="him"></div></div>
<div id="panels"></div>

<form class="typebar hidden" id="typebar"><label for="tb" class="hidden">Message</label><input id="tb" autocomplete="off" placeholder="Type to Jarvis… (Enter to send, Esc to close)"><button class="hbtn" type="submit">Send</button></form>

<div class="dock l">
  <button id="kb" type="button" title="Type instead (or just start typing)" aria-label="Type a message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M7 14h10"/></svg></button>
</div>
<div class="dock r">
  <button id="mute" type="button" title="Voice on/off" aria-label="Voice on or off"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
  <a id="console" href="/console" title="Control centre" aria-label="Open the control centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></a>
</div>

<div class="boot" id="boot">
  <div>
    <div class="brand">JARVIS</div>
    <div class="sub" id="boot-sub">Just A Rather Very Intelligent System</div>
    <form id="boot-form">
      <label for="pw" class="hidden">Access code</label>
      <input id="pw" type="password" placeholder="ACCESS CODE" autocomplete="current-password" class="hidden">
      <button class="hbtn" id="boot-btn" type="submit">Initialise</button>
      <div class="err" id="boot-err" role="alert"></div>
    </form>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEMO = window.JARVIS_DEMO || null;
const pref = { get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch (e) { /* ignore */ } } };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ======================= the holographic core (Three.js) ======================= */
const canvas = $("#gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000306);
scene.fog = new THREE.FogExp2(0x000306, 0.045);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 9);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 1.1, 0.5, 0.05);
composer.addPass(bloom);

const COLORS = { idle: 0x49d7ff, listening: 0x7dfcff, thinking: 0xff8a12, speaking: 0x9ff3ff, alert: 0xff7a1a, boot: 0x2a8fbf };
const core = new THREE.Group(); scene.add(core);
const tint = []; // materials that follow the state colour
const add = (obj, follow = true) => { core.add(obj); if (follow) tint.push(obj.material); return obj; };
const lineMat = (o = 0.8) => new THREE.LineBasicMaterial({ color: COLORS.idle, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false });
const meshMat = (o = 0.8) => new THREE.MeshBasicMaterial({ color: COLORS.idle, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

// glowing heart
function glowTexture() {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.15, "rgba(200,245,255,.95)"); gr.addColorStop(0.4, "rgba(73,215,255,.45)"); gr.addColorStop(1, "rgba(73,215,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
}
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: COLORS.idle, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
glow.scale.set(2.6, 2.6, 1); add(glow);
const ico = add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.62, 1)), lineMat(0.75)));
const ico2 = add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(0.42, 0)), lineMat(0.9)));

// segmented reactor ring (10 cells)
const cells = new THREE.Group(); core.add(cells);
for (let i = 0; i < 10; i++) {
  const m = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.2, 24, 1, i / 10 * Math.PI * 2 + 0.05, Math.PI * 2 / 10 - 0.1), meshMat(0.32));
  tint.push(m.material); cells.add(m);
}
// thin rings
const circle = (r, seg = 160) => { const pts = []; for (let i = 0; i <= seg; i++) { const a = i / seg * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); } return new THREE.BufferGeometry().setFromPoints(pts); };
add(new THREE.Line(circle(1.3), lineMat(0.55)));
const dashed = new THREE.Line(circle(2.18, 240), new THREE.LineDashedMaterial({ color: COLORS.idle, dashSize: 0.09, gapSize: 0.07, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending }));
dashed.computeLineDistances(); add(dashed);
// tick ring
const tickPts = [];
for (let i = 0; i < 180; i++) { const a = i / 180 * Math.PI * 2, long = i % 15 === 0, r0 = 1.85, r1 = long ? 2.02 : 1.93; tickPts.push(new THREE.Vector3(Math.cos(a) * r0, Math.sin(a) * r0, 0), new THREE.Vector3(Math.cos(a) * r1, Math.sin(a) * r1, 0)); }
const ticks = add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(tickPts), lineMat(0.6)));
// bright arcs
const arcs = new THREE.Group(); core.add(arcs);
for (let k = 0; k < 3; k++) { const m = new THREE.Mesh(new THREE.TorusGeometry(1.55, 0.022, 6, 80, 1.05), meshMat(0.95)); m.rotation.z = k * Math.PI * 2 / 3; tint.push(m.material); arcs.add(m); }
const arcs2 = new THREE.Group(); core.add(arcs2);
for (let k = 0; k < 2; k++) { const m = new THREE.Mesh(new THREE.TorusGeometry(2.42, 0.012, 6, 120, 2.2), meshMat(0.6)); m.rotation.z = k * Math.PI; tint.push(m.material); arcs2.add(m); }
// gyroscope rings (3D)
const gyro = [];
for (let k = 0; k < 3; k++) { const m = add(new THREE.Mesh(new THREE.TorusGeometry(1.42 + k * 0.08, 0.006, 4, 160), meshMat(0.35))); m.rotation.x = 1.1 + k * 0.5; m.rotation.y = k * 0.9; gyro.push(m); }
// spectrum bars (instanced)
const BARS = 96, barGeo = new THREE.PlaneGeometry(0.028, 1); barGeo.translate(0, 0.5, 0);
const bars = new THREE.InstancedMesh(barGeo, meshMat(0.85), BARS); tint.push(bars.material); core.add(bars);
const dummy = new THREE.Object3D();
// particles: orbital shell + deep field
function points(n, rMin, rMax, size, opacity, flat) {

  const lines = spoken.split("\n"), cut = lines.findIndex((l, i) => i > 0 && /^\s*(\||[-*•]\s|\d+[.)]\s|#|```|>)/.test(l));
  if (cut > 0) { rest = lines.slice(cut).join("\n") + (rest ? "\n\n" + rest : ""); spoken = lines.slice(0, cut).join(" "); } // "Here are your tasks:" + list
  if (/^\s*(\||[-*•]\s|\d+[.)]\s|#|```)/.test(spoken)) { rest = text; spoken = ""; } // starts with structure: show it all
  return { spoken, rest };
}

async function send(text) {
  text = (text || "").trim(); if (!text || busy) return;
  busy = true; pauseWake(); hideType(); closePanels("main");
  subs(text, ""); setState("thinking", "PROCESSING", "");
  let reply = "";
  try {
    await stream(text, (e) => {
      if (e.type === "tool") { settleTags(); const v = e.args && Object.values(e.args).find(x => typeof x === "string" && x.trim()); addTag(e.name, v); setState("thinking", "PROCESSING", (LABEL[e.name] || e.name).toUpperCase()); }
      else if (e.type === "confirm") approval(e);
      else if (e.type === "confirm_result") { document.querySelectorAll('.panel[data-kind="approval"]').forEach(dropPanel); setState("thinking", "PROCESSING", e.approved ? "AUTHORISED" : "CANCELLED"); }
      else if (e.type === "reply") reply = e.text;
      else if (e.type === "error") reply = "I ran into a problem: " + e.text;
    });
    settleTags(true);
  } catch (err) { settleTags(false); reply = "I couldn't reach my systems. " + err.message; }
  busy = false; clearTags();
  const { spoken, rest } = splitReply(reply || "Done.");
  if (rest) panel("Details", `<div class="md">${md(rest)}</div>`);
  const say = spoken || "Here you are.";
  subs(null, plain(say));
  speak(say + (rest && spoken ? " The details are on screen." : ""));
  if (!voiceOn) { idle(); resumeWake(); }
}

function approval(e) {
  setState("alert", "AUTHORISATION REQUIRED", "SAY YES OR NO");
  const el = panel("Authorisation required" + (e.source ? " · " + e.source : ""), `<div class="md"><p>${e.source ? esc(e.source) + " is asking to do this:" : "I need your approval before I do this:"}</p></div><div class="what">${esc(e.message)}</div><div class="btns"><button class="hbtn no" data-a="0">Decline</button><button class="hbtn go" data-a="1">Approve</button></div>`, { amber: true, ttl: 0, kind: "approval" });
  let answered = false;
  const answer = async (ok) => {
    if (answered) return; answered = true;
    if (rec) try { rec.abort(); } catch (x) { /* ignore */ }
    dropPanel(el); setState("thinking", "PROCESSING", ok ? "AUTHORISED" : "CANCELLED");
    try { await api("/api/confirm", { body: { id: e.id, approve: ok } }); } catch (err) { /* expired */ }
  };
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => answer(b.dataset.a === "1"));
  speak("I need your approval for this. Shall I go ahead?", () => {
    if (answered) return;
    if (SR && !DEMO) listen((t) => { if (/\b(yes|yeah|yep|go ahead|do it|approve|approved|proceed|confirm|affirmative|sure)\b/i.test(t)) answer(true); else if (/\b(no|nope|don'?t|cancel|stop|decline|negative)\b/i.test(t)) answer(false); else setState("alert", "AUTHORISATION REQUIRED", "TAP APPROVE OR DECLINE"); });
    else setState("alert", "AUTHORISATION REQUIRED", "TAP APPROVE OR DECLINE");
  });
}

/* ======================= typing ======================= */
function openType(prefill = "") {
  const tb = $("#typebar"); tb.classList.remove("hidden");
  const i = $("#tb"); if (prefill) i.value += prefill; i.focus();
  $("#kb").classList.add("on");
}
function hideType() { $("#typebar").classList.add("hidden"); $("#tb").value = ""; $("#kb").classList.remove("on"); }
$("#typebar").onsubmit = (e) => { e.preventDefault(); ensureAudio(); const t = $("#tb").value; send(t); };
$("#kb").onclick = () => ($("#typebar").classList.contains("hidden") ? openType() : hideType());
document.addEventListener("keydown", (e) => {
  if ($("#boot") && !$("#boot").classList.contains("hidden")) return;
  const typing = document.activeElement === $("#tb");
  if (e.key === "Escape") { if (speaking) stopSpeaking(); else if (typing) hideType(); else closePanels(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === " " && SR && !DEMO) { e.preventDefault(); ensureAudio(); listen(); return; }
  if (e.key.length === 1) { e.preventDefault(); openType(e.key); }
});
canvas.addEventListener("click", () => { ensureAudio(); if (speaking) return stopSpeaking(); if (busy) return; listen(); });
$("#mute").onclick = () => { voiceOn = !voiceOn; pref.set("voice", voiceOn); $("#wave").style.display = voiceOn ? "" : "none"; if (!voiceOn) stopSpeaking(); };
$("#wave").style.display = voiceOn ? "" : "none";

/* ======================= server events ======================= */
function connectEvents() {
  if (DEMO) { DEMO.onEvent = onEvent; return; }
  const es = new EventSource("/api/events");
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  es.onopen = () => { $("#sys").textContent = "SYSTEMS ONLINE"; };
  es.onerror = () => { $("#sys").textContent = "LINK LOST · RECONNECTING"; };
}
function onEvent(e) {
  if (e.type === "confirm" && e.source) { approval(e); return; }   // Hermes (or another agent) needs your OK
  if (e.type === "confirm_result" && e.source) { document.querySelectorAll('.panel[data-kind="approval"]').forEach(dropPanel); if (!busy && !speaking) idle(); return; }
  if (e.type === "panel") {   // something Hermes wants on the big screen
    panel(e.title || "Jarvis", `<div class="md">${md(e.markdown || "")}</div>`, { ttl: 90000 });
    if (e.speak && !busy && !speaking) { subs("", e.speak); speak(e.speak); }
    return;
  }
  if (e.type === "media" && e.item && e.item.auto) showMedia(e.item);
  else if (e.type === "alert") {
    panel(e.title || "Alert", `<div class="md"><p>${esc(e.text)}</p></div>`, { amber: true, ttl: 30000, kind: "alert" });
    if (!busy && !speaking) { subs("", `${e.title}: ${e.text}`); speak(`${e.title}. ${e.text}`); }
  }
}

/* ======================= boot ======================= */
function needLogin() {
  $("#boot").classList.remove("hidden"); $("#pw").classList.remove("hidden"); $("#boot-btn").textContent = "Sign in";
  $("#boot-sub").textContent = "Access code required"; setTimeout(() => $("#pw").focus(), 50);
}
async function loadState() {
  try { STATE = await api("/api/state"); return true; } catch (e) { return false; }
}
async function initialise() {
  ensureAudio();
  $("#boot").classList.add("hidden");
  setState("thinking", "INITIALISING", "BRINGING SYSTEMS ONLINE");
  try { VOICES = await api("/api/voices"); } catch (e) { /* defaults */ }
  connectEvents();
  if (SR && !DEMO && wakeOn) { try { const s = await navigator.mediaDevices.getUserMedia({ audio: true }); s.getTracks().forEach(t => t.stop()); } catch (e) { wakeOn = false; } }
  setTimeout(() => {
    const h = new Date().getHours(), part = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
    const name = STATE && STATE.profile ? STATE.profile.name : "";
    const greet = `Good ${part}${name ? ", " + name : ""}. All systems are online.`;
    subs("", greet); speak(greet, () => { idle(); resumeWake(); });
    if (!voiceOn) { idle(); resumeWake(); }
  }, 1300);
}
$("#boot-form").onsubmit = async (e) => {
  e.preventDefault(); $("#boot-err").textContent = "";
  if (!$("#pw").classList.contains("hidden")) {
    try { await api("/api/login", { body: { password: $("#pw").value } }); } catch (err) { $("#boot-err").textContent = err.message.toUpperCase(); return; }
    if (!(await loadState())) return;
  }
  initialise();
};
if (DEMO) { $("#demo-note").classList.remove("hidden"); if (DEMO.consoleHref) $("#console").href = DEMO.consoleHref; else { $("#console").href = "#"; $("#console").onclick = (e) => { e.preventDefault(); panel("Control centre", '<p class="md">On your own Jarvis this opens the full control centre: integrations, programs, memory, knowledge, tasks, cameras and settings.</p>', { ttl: 10000 }); }; } }
(async () => {
  setState("boot", "", "");
  if (!(await loadState())) needLogin(); else { $("#boot-btn").focus(); }
})();
</script>
