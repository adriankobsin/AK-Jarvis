<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a command centre. Icon rail on the left, the reactor core and conversation in the
   middle, a live operations column on the right (what Jarvis is doing, queue, vitals, feeds).
   On phones the ops column becomes its own tab. One visual world: deep navy, cyan light. */
:root {
  --bg: #02060b;
  --panel: rgba(7, 19, 31, .78);
  --panel-solid: #08141f;
  --line: rgba(84, 205, 255, .16);
  --line-strong: rgba(84, 205, 255, .42);
  --ink: #d6ecfb;
  --ink-dim: #7896ad;
  --accent: #39d0ff;
  --accent-2: #9df3ff;
  --accent-ink: #011018;
  --amber: #ffb547;
  --good: #3ef0a1;
  --bad: #ff5d6c;
  --font-brand: "Orbitron", "Chakra Petch", ui-sans-serif, sans-serif;
  --font-display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(57, 208, 255, .10), transparent 60%),
    radial-gradient(900px 600px at 100% 100%, rgba(57, 120, 255, .07), transparent 60%),
    linear-gradient(rgba(84, 205, 255, .035) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, rgba(84, 205, 255, .035) 1px, transparent 1px) 0 0 / 32px 100%,
    var(--bg);
}
body::after { /* faint scan line */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: linear-gradient(transparent 0, rgba(157, 243, 255, .05) 50%, transparent 100%) 0 -100vh / 100% 30vh no-repeat;
  animation: scan 9s linear infinite;
}
@keyframes scan { to { background-position: 0 130vh; } }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .04em; text-wrap: balance; margin: 0; }
h1 { font-size: 22px; } h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .12em; } h3 { font-size: 14px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.dim { color: var(--ink-dim); }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: rgba(57, 208, 255, .35); }
* { scrollbar-width: thin; scrollbar-color: rgba(84, 205, 255, .25) transparent; }

/* ---------- HUD frame ---------- */
.hud { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hud::before, .hud::after { content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none; border-color: var(--line-strong); border-style: solid; }
.hud::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.hud::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
.label b { color: var(--accent); font-weight: 500; }

/* ---------- shell ---------- */
#app { display: grid; grid-template-columns: 68px minmax(0, 1fr) 368px; flex: 1; min-height: 0; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0; border-right: 1px solid var(--line); background: rgba(2, 8, 14, .6); min-height: 0; }
.mark { width: 38px; height: 38px; margin-bottom: 10px; border-radius: 50%; position: relative;
  background: radial-gradient(circle, #eafcff 0 12%, #5fd8ff 30%, #0d4f78 62%, transparent 64%); box-shadow: 0 0 22px rgba(57, 208, 255, .45); }
.mark::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px dashed var(--line-strong); animation: spin 14s linear infinite; }
.nav { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; scrollbar-width: none; }
.nav a { position: relative; width: 44px; height: 42px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-dim); }
.nav a svg { width: 20px; height: 20px; }
.nav a:hover { color: var(--ink); background: rgba(57, 208, 255, .08); }
.nav a.active { color: var(--accent); background: rgba(57, 208, 255, .12); box-shadow: inset 2px 0 0 var(--accent), 0 0 18px rgba(57, 208, 255, .12); }
.nav a .tip { position: absolute; left: 52px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: var(--panel-solid); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; font-size: 12px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; }
.nav a:hover .tip, .nav a:focus-visible .tip { opacity: 1; }
.nav .sep { height: 1px; width: 28px; background: var(--line); margin: 6px auto; }
.rail .who { margin-top: auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--panel-solid); font-family: var(--font-display); font-weight: 600; cursor: pointer; }
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: rgba(2, 8, 14, .45); }
.brand { font-family: var(--font-brand); font-weight: 700; letter-spacing: .38em; font-size: 15px; color: var(--accent-2); text-shadow: 0 0 14px rgba(57, 208, 255, .55); }
.topbar .spacer { flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }
.chip .dot, .light { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
.chip.on .dot, .light.on { background: var(--good); box-shadow: 0 0 8px var(--good); }
.chip.busy .dot, .light.busy { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 1s infinite; }
.chip.on { color: var(--ink); }
.clock { font-family: var(--font-mono); font-size: 13px; color: var(--ink); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 22px clamp(14px, 3vw, 32px) 36px; }
.view.core { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head p { margin: 6px 0 0; color: var(--ink-dim); max-width: 64ch; }
.ops { border-left: 1px solid var(--line); background: rgba(2, 8, 14, .55); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.tabbar { display: none; }

/* ---------- controls ---------- */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line-strong); background: rgba(57, 208, 255, .06); cursor: pointer; font-family: var(--font-display); font-weight: 500; letter-spacing: .06em; white-space: nowrap; color: var(--ink); transition: background .15s, box-shadow .15s; }
.btn:hover { background: rgba(57, 208, 255, .14); box-shadow: 0 0 16px rgba(57, 208, 255, .15); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 18px rgba(57, 208, 255, .35); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); border-color: rgba(255, 93, 108, .4); background: rgba(255, 93, 108, .05); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.icon { padding: 8px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
input[type=text], input[type=password], input[type=search], input[type=url], input[type=datetime-local], input[type=date], select, textarea {
  width: 100%; background: rgba(1, 6, 11, .8); border: 1px solid var(--line); border-radius: 4px; padding: 9px 11px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(57, 208, 255, .12); }
textarea { resize: vertical; min-height: 84px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 180px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 16px; }
.card::before { content: ""; position: absolute; top: -1px; left: -1px; width: 12px; height: 12px; border: solid var(--line-strong); border-width: 2px 0 0 2px; pointer-events: none; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap; }
.pill.on { color: var(--good); border-color: rgba(62, 240, 161, .3); }
.pill.off { color: var(--ink-dim); }
.pill.warn { color: var(--amber); border-color: rgba(255, 181, 71, .35); }
.pill.accent { color: var(--accent); border-color: rgba(57, 208, 255, .35); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .actions { display: flex; gap: 6px; flex: none; }
.empty { color: var(--ink-dim); padding: 14px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; }
.tile .n { font-family: var(--font-brand); font-size: 24px; color: var(--accent-2); font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(57, 208, 255, .35); }
.tile .l { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.section-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cat { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .14em; margin: 14px 0 2px; }
.cat.core { color: var(--amber); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); background: rgba(57, 208, 255, .08); font-family: var(--font-display); font-weight: 600; color: var(--accent-2); flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .35; } }

/* ---------- core: reactor + transcript ---------- */
.reactor-wrap { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 10px clamp(14px, 3vw, 32px) 4px; }
#reactor { width: clamp(180px, 30vh, 290px); height: clamp(180px, 30vh, 290px); cursor: pointer; display: block; }
.readout { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.readout.right { align-items: flex-end; text-align: right; }
.readout .big { font-family: var(--font-brand); font-size: 18px; letter-spacing: .14em; color: var(--accent-2); }
.state { text-align: center; margin-top: -4px; }
.state .s1 { font-family: var(--font-brand); font-size: 13px; letter-spacing: .32em; color: var(--accent-2); text-shadow: 0 0 10px rgba(57, 208, 255, .5); }
.state .s2 { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80vw; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 3px; border: 1px solid var(--line); background: rgba(1, 6, 11, .6); cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.toggle::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-dim); }
.toggle[aria-pressed="true"] { color: var(--accent-2); border-color: var(--line-strong); }
.toggle[aria-pressed="true"]::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.toggle.teach[aria-pressed="true"] { color: var(--amber); border-color: rgba(255, 181, 71, .45); }
.toggle.teach[aria-pressed="true"]::before { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.messages { flex: 1; overflow-y: auto; padding: 12px clamp(14px, 3vw, 32px) 16px; display: flex; flex-direction: column; gap: 14px; mask-image: linear-gradient(transparent 0, #000 22px); }
.msg { max-width: min(780px, 94%); }
.msg .who { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 4px; color: var(--ink-dim); }
.msg.user { align-self: flex-end; text-align: left; }
.msg.user .bubble { background: rgba(57, 208, 255, .1); border: 1px solid var(--line-strong); padding: 9px 13px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .who { text-align: right; }
.msg.bot { align-self: flex-start; border-left: 2px solid var(--accent); padding-left: 14px; }
.msg.bot .who { color: var(--accent); }
.msg.system { align-self: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.msg.alert { align-self: center; border: 1px solid rgba(255, 181, 71, .45); background: rgba(255, 181, 71, .08); color: #ffd99a; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
.msg img.snap { max-width: 220px; border: 1px solid var(--line-strong); border-radius: 4px; display: block; margin-top: 6px; }
.steps { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
.step { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.step .ic { width: 14px; flex: none; text-align: center; color: var(--accent); }
.step .nm { flex: none; color: var(--ink); }
.step .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.step .ms { margin-left: auto; flex: none; font-size: 11px; }
.step.running .ic { animation: spin 1s linear infinite; display: inline-block; }
.step.error .ic { color: var(--bad); }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md h1, .md h2, .md h3 { margin: 14px 0 6px; text-transform: none; letter-spacing: .02em; }
.md code { font-family: var(--font-mono); font-size: 13px; background: rgba(57, 208, 255, .08); padding: 1px 5px; border-radius: 3px; }
.md pre { background: rgba(1, 6, 11, .8); border: 1px solid var(--line); border-radius: 4px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--line-strong); color: var(--ink-dim); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; margin-bottom: 10px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.md th { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 6px; height: 6px; background: var(--accent); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.composer { border-top: 1px solid var(--line); background: rgba(2, 8, 14, .7); padding: 10px clamp(14px, 3vw, 32px) 12px; }
.composer .inner { max-width: 940px; margin: 0 auto; display: flex; flex-direction: column; gap: 9px; }
.composer form { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 180px; resize: none; padding: 12px; }
.micbtn { width: 46px; height: 46px; border-radius: 50%; flex: none; border: 1px solid var(--line-strong); background: radial-gradient(circle, rgba(57, 208, 255, .25), rgba(57, 208, 255, .04)); color: var(--accent-2); cursor: pointer; display: grid; place-items: center; }
.micbtn svg { width: 20px; height: 20px; }
.micbtn.rec { background: radial-gradient(circle, rgba(255, 93, 108, .55), rgba(255, 93, 108, .12)); border-color: var(--bad); color: #fff; animation: pulse 1.2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 93, 108, .5); } 100% { box-shadow: 0 0 0 16px rgba(255, 93, 108, 0); } }
.suggest { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; white-space: nowrap; font-size: 13px; padding: 4px 10px; border-radius: 3px; border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-dim); cursor: pointer; }
.suggest button:hover { color: var(--accent-2); border-style: solid; }

/* ---------- ops column ---------- */
.panel { padding: 12px; }
.panel > .label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.feed img:not([src]), .feed img[src=""] { visibility: hidden; }
.feed img { color: transparent; font-size: 0; }
.run { border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; background: rgba(1, 6, 11, .55); }
.run + .run { margin-top: 8px; }
.run.running { border-color: var(--line-strong); box-shadow: 0 0 18px rgba(57, 208, 255, .12) inset; }
.run.error { border-color: rgba(255, 93, 108, .45); }
.run .rh { display: flex; gap: 8px; align-items: center; }
.run .rt { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run .tag { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em; padding: 1px 6px; border-radius: 2px; border: 1px solid var(--line-strong); color: var(--accent); text-transform: uppercase; flex: none; }
.run .tag.phone { color: var(--amber); border-color: rgba(255, 181, 71, .45); }
.run .tag.automation { color: var(--good); border-color: rgba(62, 240, 161, .4); }
.run .el { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); flex: none; font-variant-numeric: tabular-nums; }
.run .steps { margin: 7px 0 0; }
.bar { height: 3px; background: rgba(84, 205, 255, .12); border-radius: 2px; overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: sweep 1.3s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.q { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.q:first-of-type { border-top: 0; }
.q .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .w { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); flex: none; font-variant-numeric: tabular-nums; }
.prio { width: 3px; align-self: stretch; border-radius: 2px; background: var(--line-strong); flex: none; }
.prio.high { background: var(--amber); box-shadow: 0 0 6px var(--amber); } .prio.low { background: var(--line); }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.gauge { text-align: center; }
.gauge canvas { width: 72px; height: 72px; display: block; margin: 0 auto; }
.gauge .label { margin-top: 2px; }
#spark { width: 100%; height: 46px; display: block; margin-top: 8px; }
.lights { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; }
.lights div { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-dim); }
.feed { position: relative; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #01050a; cursor: pointer; aspect-ratio: 16 / 9; display: grid; place-items: center; }
.feed img, .feed canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.feed .cap { position: absolute; left: 6px; top: 5px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--accent-2); background: rgba(1, 6, 11, .7); padding: 1px 6px; border-radius: 2px; text-transform: uppercase; }

.feeds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- browser / media / camera ---------- */
.browser-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.browser-bar input { flex: 1; font-family: var(--font-mono); font-size: 13px; }
.screen { position: relative; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: #01050a; box-shadow: 0 0 40px rgba(57, 208, 255, .08); }
.screen img { width: 100%; display: block; cursor: crosshair; }
.screen .ov { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--ink-dim); }
.screen .driving { position: absolute; left: 10px; top: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--amber); background: rgba(1, 6, 11, .8); border: 1px solid rgba(255, 181, 71, .45); padding: 3px 8px; border-radius: 3px; }
.player { border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: #01050a; min-height: 200px; display: grid; place-items: center; }
.player iframe, .player video, .player img { width: 100%; display: block; border: 0; }
.player iframe { aspect-ratio: 16 / 9; height: auto; }
.player audio { width: calc(100% - 32px); margin: 24px 16px; }
.cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
video.cam { width: 100%; border: 1px solid var(--line-strong); border-radius: 4px; background: #01050a; display: block; }

/* ---------- architecture ---------- */
.arch { display: grid; gap: 8px; }
.layer { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: stretch; }
.layer .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-dim); padding-top: 10px; }
.boxes { display: flex; flex-wrap: wrap; gap: 8px; }
.box { background: rgba(1, 6, 11, .6); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; min-width: 120px; flex: 1 1 140px; }
.box b { display: block; font-weight: 600; font-size: 14px; }
.box span { font-size: 12px; color: var(--ink-dim); }
.box.core { border-color: var(--line-strong); background: rgba(57, 208, 255, .07); box-shadow: 0 0 16px rgba(57, 208, 255, .08) inset; }
.flow { text-align: center; color: var(--accent); font-family: var(--font-mono); font-size: 12px; margin-left: 142px; opacity: .7; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tools-grid ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tools-grid li { font-size: 13px; color: var(--ink-dim); }
.tools-grid li code { font-family: var(--font-mono); font-size: 12px; color: var(--accent-2); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(1, 4, 8, .75); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { position: relative; width: min(540px, 100%); max-height: 90%; overflow-y: auto; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 60px rgba(57, 208, 255, .15); }
.dialog.approve { border-color: rgba(255, 181, 71, .6); box-shadow: 0 0 60px rgba(255, 181, 71, .18); }
.dialog.approve h2 { color: var(--amber); }
.dialog .what { font-family: var(--font-mono); font-size: 13px; background: rgba(1, 6, 11, .8); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; overflow-wrap: anywhere; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog.wide { width: min(900px, 100%); }
.doc-text { white-space: pre-wrap; font-size: 14px; background: rgba(1, 6, 11, .8); border: 1px solid var(--line); border-radius: 4px; padding: 12px; max-height: 60vh; overflow-y: auto; }
#toasts { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel-solid); border: 1px solid var(--line-strong); border-left: 3px solid var(--accent); border-radius: 4px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-size: 14px; }
.toast.alert { border-left-color: var(--amber); }
.toast.error { border-left-color: var(--bad); }
.toast b { display: block; margin-bottom: 2px; font-family: var(--font-display); letter-spacing: .05em; }

/* ---------- login ---------- */
#login { flex: 1; display: grid; place-items: center; padding: 16px; }
#login form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
#login .brand { font-size: 26px; }
#login canvas { width: 200px; height: 200px; }
#login .err { color: var(--bad); min-height: 1.5em; font-size: 14px; }
.demo-banner { background: rgba(255, 181, 71, .1); color: #ffd99a; border-bottom: 1px solid rgba(255, 181, 71, .35); padding: 5px 16px; font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<div id="demo-banner" class="demo-banner hidden">Demo with sample data. On your own Jarvis, every action here is real.</div>

<script>
"use strict";
/* ================= icons ================= */
const I = {
  core: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 2"/><circle cx="12" cy="12" r="10.5"/>',
  ops: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  browser: '<rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',
  media: '<rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M10 9.5v5l4.5-2.5z"/>',
  camera: '<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  memory: '<path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3zM9 22h6"/>',
  knowledge: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3"/><path d="M20 4v14h-7"/>',
  procedures: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  tasks: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/>',
  automations: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
  phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  family: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M3 20a6 6 0 0 1 12 0M14 20a4 4 0 0 1 7 0"/>',
  integrations: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="8.5" y="14" width="7" height="7" rx="1"/><path d="M6.5 10v2h11v-2M12 12v2"/>',
  programs: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  system: '<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
};
const icon = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const VIEWS = [
  ["core", "Core"], ["ops", "Operations"], ["integrations", "Integrations"], ["programs", "Programs"], ["browser", "Browser"], ["media", "Media"], ["camera", "Camera"],
  ["tasks", "Tasks & reminders"], ["memory", "Memory"], ["knowledge", "Knowledge"], ["procedures", "Procedures"],
  ["automations", "Automations"], ["phone", "Phone"], ["family", "Family"], ["settings", "Voice & settings"], ["system", "How it's built"],
];
const OWNER_ONLY = new Set(["browser", "automations", "phone", "integrations", "programs"]);
const TABS = [["core", "Core"], ["ops", "Ops"], ["browser", "Browser"], ["camera", "Camera"], ["more", "More"]];

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };
const pref = { get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } } };
function until(iso) {
  const ms = new Date(iso) - Date.now(); if (isNaN(ms)) return "";
  const m = Math.round(Math.abs(ms) / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  const s = d >= 1 ? `${d}d ${h % 24}h` : h >= 1 ? `${h}h ${m % 60}m` : `${m}m`;
  if (Math.abs(ms) > 7 * 864e5) return new Date(iso).toLocaleDateString([], { day: "numeric", month: "short", year: Math.abs(ms) > 300 * 864e5 ? "numeric" : undefined });
  return ms >= 0 ? `in ${s}` : `${s} ago`;
}
const elapsed = (sec) => sec < 60 ? `${Math.floor(sec)}s` : `${Math.floor(sec / 60)}m ${Math.floor(sec % 60)}s`;
let STATE = null;

function md(src) {
  const blocks = [];
  let s = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => { blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.type}>`); list = null; } };
  const lines = s.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const ph = line.match(/^\u0000(\d+)\u0000$/);
    if (ph) { flushPara(); flushList(); out.push(blocks[+ph[1]]); continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      flushPara(); flushList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = `<table><thead><tr>${cells(line).map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>`;
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += `<tr>${cells(lines[i]).map(c => `<td>${c}</td>`).join("")}</tr>`; i++; }
      i--; out.push(html + "</tbody></table>"); continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
    const bq = line.match(/^>\s?(.*)/);
    if (bq) { flushPara(); flushList(); out.push(`<blockquote>${inline(bq[1])}</blockquote>`); continue; }
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) { flushPara(); const type = ul ? "ul" : "ol"; if (!list || list.type !== type) { flushList(); list = {type, items: []}; } list.items.push((ul || ol)[1]); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}

function toast(title, text = "", kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `<b>${esc(title)}</b>${esc(text)}`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), kind === "alert" ? 12000 : 4500);
}
function dialog(html, cls = "") {
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="dialog ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  $("#overlay-root").appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov && !cls.includes("approve")) close(); });
  const first = ov.querySelector("input, textarea, select, button");
  if (first) setTimeout(() => first.focus(), 30);
  return { el: ov, close };
}

/* ================= API ================= */
const DEMO = window.JARVIS_DEMO || null;
async function api(path, opts = {}) {
  if (DEMO) return DEMO.api(path, opts);
  const init = { method: opts.method || (opts.body !== undefined || opts.form ? "POST" : "GET"), credentials: "same-origin", headers: {} };
  if (opts.form) init.body = opts.form;
  else if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please sign in."); }
  if (r.status === 204) return null;
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.detail) || `Request failed (${r.status})`);
  return data;
}
async function stream(path, body, onEvent) {
  if (DEMO) return DEMO.chat(body.text || body.question, !!body.voice, onEvent, body);
  const r = await fetch(path, { method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  if (r.status === 401) { showLogin(); return; }
  if (!r.ok || !r.body) throw new Error(`Request failed (${r.status})`);
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split("\n").find(l => l.startsWith("data: "));
      if (line) onEvent(JSON.parse(line.slice(6)));
    }
  }
}
/* URLs for images/files: real server paths, or demo-generated images */
function mediaSrc(item) {
  if (DEMO && DEMO.src) { const d = DEMO.src(item); if (d) return d; }
  const s = item.source || "";
  if (s.startsWith("camera:")) return `/api/cameras/${encodeURIComponent(s.slice(7))}/snapshot?t=${Date.now()}`;
  if (/^(https?:|data:|blob:)/.test(s)) return s;

}

/* ================= the reactor ================= */
class Reactor {
  constructor(canvas) {
    this.c = canvas; this.g = canvas.getContext("2d");
    this.state = "idle"; this.level = 0; this.target = 0; this.analyser = null; this.freq = null; this.t0 = performance.now();
    this.spin = 0; this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const loop = (t) => { this.draw(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  setState(s) { this.state = s; }
  attach(analyser) { this.analyser = analyser; this.freq = analyser ? new Uint8Array(analyser.frequencyBinCount) : null; }
  palette() {
    return { idle: [57, 208, 255], listening: [62, 240, 200], thinking: [255, 181, 71], speaking: [120, 230, 255], alert: [255, 93, 108] }[this.state] || [57, 208, 255];
  }
  draw(t) {
    const g = this.g, W = this.c.width, H = this.c.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.46;
    const time = (t - this.t0) / 1000;
    // audio level
    let bars = null;
    if (this.analyser && (this.state === "speaking" || this.state === "listening")) {
      this.analyser.getByteFrequencyData(this.freq);
      let sum = 0; for (let i = 0; i < 48; i++) sum += this.freq[i]; this.target = Math.min(1, sum / 48 / 150); bars = this.freq;
    } else if (this.state === "speaking") this.target = 0.35 + 0.3 * Math.abs(Math.sin(time * 7.3) * Math.sin(time * 3.1));
    else if (this.state === "thinking") this.target = 0.25 + 0.1 * Math.sin(time * 4);
    else if (this.state === "listening") this.target = 0.2 + 0.1 * Math.sin(time * 3);
    else this.target = 0.08 + 0.04 * Math.sin(time * 1.4);
    this.level += (this.target - this.level) * 0.18;
    const L = this.level, [r, gg, b] = this.palette(), col = (a) => `rgba(${r},${gg},${b},${a})`;
    const speed = this.reduced ? 0 : ({ thinking: 2.2, listening: 0.9, speaking: 0.7 }[this.state] || 0.25);
    this.spin += speed * 0.016;
    g.clearRect(0, 0, W, H);
    g.save(); g.translate(cx, cy);
    // outer tick ring
    g.rotate(this.spin * 0.25);
    for (let i = 0; i < 120; i++) {
      const a = i / 120 * Math.PI * 2, long = i % 10 === 0;
      g.strokeStyle = col(long ? 0.75 : 0.28); g.lineWidth = long ? 3 : 1.5;
      g.beginPath(); g.moveTo(Math.cos(a) * R, Math.sin(a) * R); g.lineTo(Math.cos(a) * (R - (long ? 16 : 8)), Math.sin(a) * (R - (long ? 16 : 8))); g.stroke();
    }
    g.rotate(-this.spin * 0.25);
    // rotating arc segments
    g.lineCap = "round";
    for (let k = 0; k < 3; k++) {
      const a0 = this.spin + k * (Math.PI * 2 / 3);
      g.strokeStyle = col(0.85); g.lineWidth = 5; g.shadowColor = col(0.9); g.shadowBlur = 16;
      g.beginPath(); g.arc(0, 0, R * 0.86, a0, a0 + 0.9); g.stroke();
    }
    g.shadowBlur = 0;
    // counter-rotating dashed ring
    g.setLineDash([10, 9]); g.strokeStyle = col(0.45); g.lineWidth = 2;
    g.beginPath(); g.arc(0, 0, R * 0.76, -this.spin * 1.6, -this.spin * 1.6 + Math.PI * 2); g.stroke(); g.setLineDash([]);
    // frequency / activity bars
    const N = 72, r0 = R * 0.56;
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2 - Math.PI / 2;
      let v = bars ? bars[Math.floor((i < N / 2 ? i : N - i) * 1.1) + 2] / 255 : (0.3 + 0.7 * Math.abs(Math.sin(i * 0.7 + time * (this.state === "idle" ? 0.8 : 4)))) * L;
      const len = 4 + v * R * 0.17;
      g.strokeStyle = col(0.35 + v * 0.65); g.lineWidth = 3;
      g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * (r0 + len), Math.sin(a) * (r0 + len)); g.stroke();
    }
    // segmented inner ring (10 cells)
    for (let i = 0; i < 10; i++) {
      const a0 = i / 10 * Math.PI * 2 - this.spin * 0.6, a1 = a0 + Math.PI * 2 / 10 - 0.09;
      g.fillStyle = col(0.16 + 0.5 * L);
      g.beginPath(); g.arc(0, 0, R * 0.5, a0, a1); g.arc(0, 0, R * 0.42, a1, a0, true); g.closePath(); g.fill();
    }
    // core glow
    const cr = R * (0.3 + 0.08 * L);
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, cr * 1.6);
    grad.addColorStop(0, "rgba(255,255,255,0.95)"); grad.addColorStop(0.18, col(0.95)); grad.addColorStop(0.55, col(0.35)); grad.addColorStop(1, col(0));
    g.globalCompositeOperation = "lighter"; g.fillStyle = grad;
    g.beginPath(); g.arc(0, 0, cr * 1.6, 0, Math.PI * 2); g.fill();
    g.globalCompositeOperation = "source-over";
    g.strokeStyle = col(0.9); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, R * 0.33, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
}

/* ================= voice: speaking & listening ================= */
let reactor = null, audioCtx = null, currentAudio = null, micStream = null;
let voiceOn = pref.get("voice", true), convoOn = pref.get("convo", false), wakeOn = pref.get("wake", false);
let voiceId = pref.get("voiceId", ""), micLang = pref.get("lang", "en-GB");
let VOICES = { server_tts: false, voices: [], default: "en-GB-RyanNeural" };
let listening = false, speaking = false, busy = false;

function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function setStatus(s1, s2 = "", state) {
  $("#state1").textContent = s1; $("#state2").textContent = s2;
  if (state && reactor) reactor.setState(state);
  updateChips();
}
function idle() {
  if (busy || speaking || listening) return;
  setStatus(STATE && STATE.mode === "teach" ? "TEACH MODE" : "STANDING BY", wakeOn ? 'Say "Jarvis…" or tap the core' : "Tap the core to talk", "idle");
}
function plainForSpeech(text) {
  return String(text).replace(/```[\s\S]*?```/g, " (code on screen) ").replace(/\|[^\n]*\|/g, " ").replace(/[*_#`>|]/g, "")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/https?:\/\/\S+/g, "").replace(/\s+/g, " ").trim().slice(0, 1400);
}
async function speak(text) {
  const plain = plainForSpeech(text);
  if (!plain) return afterSpeaking();
  stopSpeaking(true);
  speaking = true; pauseWake();
  setStatus("SPEAKING", "Tap the core to interrupt", "speaking");
  if (!DEMO && VOICES.server_tts) {
    try {
      const r = await fetch(`/api/tts?voice=${encodeURIComponent(voiceId || VOICES.default)}&text=${encodeURIComponent(plain)}`, { credentials: "same-origin" });
      if (!r.ok) throw new Error("tts");
      const url = URL.createObjectURL(await r.blob());
      const a = new Audio(url); currentAudio = a;
      const ctx = ensureAudio();
      if (ctx) { const src = ctx.createMediaElementSource(a); const an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an); an.connect(ctx.destination); reactor.attach(an); }
      a.onended = () => { URL.revokeObjectURL(url); afterSpeaking(); };
      await a.play();
      return;
    } catch (e) { /* fall back to the browser's voice */ }
  }
  if (!("speechSynthesis" in window)) return afterSpeaking();
  reactor.attach(null);
  const u = new SpeechSynthesisUtterance(plain);
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /en-GB/i.test(x.lang) && /daniel|ryan|george|arthur|male/i.test(x.name)) || vs.find(x => /en-GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
  if (v) u.voice = v;
  u.rate = 1.02; u.pitch = 0.95;
  u.onend = afterSpeaking; u.onerror = afterSpeaking;

}
function stopSpeaking(silent) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (!silent && speaking) { speaking = false; reactor.attach(null); idle(); resumeWake(); }
}
function afterSpeaking() {
  if (!speaking) return;
  speaking = false; reactor.attach(null); currentAudio = null;
  if (convoOn && !DEMO) setTimeout(() => startListening(), 250);
  else { idle(); resumeWake(); }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, mediaRec = null;
async function micAnalyser() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const ctx = ensureAudio();
    if (ctx) { const an = ctx.createAnalyser(); an.fftSize = 256; ctx.createMediaStreamSource(micStream).connect(an); reactor.attach(an); return an; }
  } catch (e) { micStream = null; }
  return null;
}
function releaseMic() { if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; } reactor.attach(null); }

async function startListening() {
  if (DEMO) { toast("Voice works on your own Jarvis", "This demo can't use the microphone. Type instead."); return; }
  if (listening) return stopListening();
  stopSpeaking(true); speaking = false; pauseWake(); ensureAudio();
  listening = true; $("#mic").classList.add("rec");
  setStatus("LISTENING", "Go ahead…", "listening");
  if (SR) {
    await micAnalyser();
    rec = new SR(); rec.lang = micLang; rec.interimResults = true; rec.continuous = false;
    let finalText = "";
    rec.onresult = (ev) => {
      const t = Array.from(ev.results).map(r => r[0].transcript).join("");
      $("#state2").textContent = t; $("#chat-input").value = t;
      if (ev.results[ev.results.length - 1].isFinal) finalText = t;
    };
    rec.onerror = (e) => { if (e.error === "not-allowed") toast("Microphone blocked", "Allow microphone access for this site in your browser settings.", "error"); };
    rec.onend = () => {
      listening = false; rec = null; $("#mic").classList.remove("rec"); releaseMic();
      const t = (finalText || $("#chat-input").value).trim(); $("#chat-input").value = "";
      if (t) send(t, { voice: true }); else { idle(); resumeWake(); }
    };
    rec.start();
    return;
  }
  // No browser speech recognition (e.g. Firefox): record, auto-stop on silence, transcribe on the server.
  const an = await micAnalyser();
  if (!micStream) { listening = false; $("#mic").classList.remove("rec"); toast("Microphone unavailable", "Allow microphone access, or type instead.", "error"); return idle(); }
  const chunks = []; mediaRec = new MediaRecorder(micStream);
  mediaRec.ondataavailable = (e) => chunks.push(e.data);
  mediaRec.onstop = async () => {
    const type = mediaRec.mimeType; mediaRec = null; listening = false; $("#mic").classList.remove("rec"); releaseMic();
    setStatus("PROCESSING", "Transcribing…", "thinking");
    const form = new FormData(); form.append("audio", new Blob(chunks, { type }), "speech.webm");
    try { const { text } = await api("/api/transcribe", { form }); if (text) send(text, { voice: true }); else { setStatus("STANDING BY", "I didn't catch that", "idle"); resumeWake(); } }
    catch (err) { idle(); toast("Couldn't transcribe", err.message, "error"); }

  const buf = new Uint8Array(an ? an.fftSize : 0); let heard = false, quietSince = 0; const t0 = Date.now();

    if (!mediaRec) return;
    let peak = 0; if (an) { an.getByteTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v - 128)); }
    if (peak > 14) { heard = true; quietSince = 0; } else if (heard && !quietSince) quietSince = Date.now();
    if ((heard && quietSince && Date.now() - quietSince > 1300) || Date.now() - t0 > 15000) return stopListening();

}

/* Wake word: continuous recognition, triggers on "Jarvis" */
let wakeRec = null, wakePaused = false;
function startWake() {
  if (!wakeOn || !SR || DEMO || wakeRec || listening || speaking || busy) return;
  wakeRec = new SR(); wakeRec.lang = micLang; wakeRec.continuous = true; wakeRec.interimResults = false;
  wakeRec.onresult = (ev) => {
    const t = ev.results[ev.results.length - 1][0].transcript.trim();
    const m = t.match(/\bjarvis\b[,.!?]?\s*(.*)$/i);
    if (!m) return;
    const rest = m[1].trim();
    pauseWake();
    if (rest.split(/\s+/).length >= 2) send(rest, { voice: true }); else startListening();
  };
  wakeRec.onend = () => { wakeRec = null; if (wakeOn && !wakePaused) setTimeout(startWake, 400); };
  wakeRec.onerror = (e) => { if (e.error === "not-allowed") { wakeOn = false; pref.set("wake", false); syncToggles(); toast("Wake word needs the microphone", "Allow microphone access for this site.", "error"); } };
  try { wakeRec.start(); } catch (e) { wakeRec = null; }
  updateChips();
}
function pauseWake() { wakePaused = true; if (wakeRec) { try { wakeRec.abort(); } catch (e) { /* ignore */ } wakeRec = null; } }
function resumeWake() { wakePaused = false; if (wakeOn) setTimeout(startWake, 300); }

async function send(text, opts = {}) {
  text = (text || "").trim();
  if (!text || busy) return;
  if (location.hash && location.hash !== "#core" && !opts.stay) location.hash = "#core";
  busy = true; $("#send").disabled = true; pauseWake();
  if (!opts.hidden) addMsg("user", esc(text), opts.image ? `<img class="snap" src="${opts.image}" alt="Camera frame sent to Jarvis">` : "");
  const bot = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
  const steps = $(".steps", bot), body = $(".md", bot);
  setStatus("PROCESSING", "Thinking…", "thinking");
  let replied = "";
  try {
    const path = opts.image ? "/api/vision" : "/api/chat";
    const payload = opts.image ? { image: opts.image, question: text, voice: !!opts.voice } : { text, voice: !!opts.voice };
    await stream(path, payload, (e) => {
      if (e.type === "tool") { finishSteps(steps); steps.insertAdjacentHTML("beforeend", stepHtml(e.name, e.args)); setStatus("PROCESSING", label(e.name) + "…", "thinking"); scrollDown(); }
      else if (e.type === "confirm") askApproval(e);
      else if (e.type === "confirm_result") steps.insertAdjacentHTML("beforeend", `<div class="step"><span class="ic">${e.approved ? "✓" : "✕"}</span><span class="nm">${e.approved ? "You approved it" : "You declined it"}</span></div>`);
      else if (e.type === "reply") { finishSteps(steps); replied = e.text; body.innerHTML = md(e.text); if (e.mode) setTeach(e.mode === "teach"); }
      else if (e.type === "error") { finishSteps(steps, false); body.innerHTML = `<p style="color:var(--bad)">${esc(e.text)}</p>`; }
    });

    finishSteps(steps, false); body.innerHTML = `<p style="color:var(--bad)">${esc(err.message)}</p>`;
  } finally {
    busy = false; $("#send").disabled = false; scrollDown();
    if (replied && (voiceOn || opts.voice)) speak(replied);
    else { idle(); resumeWake(); }
  }
}

/* ================= live operations ================= */
const OPS = { runs: new Map(), dash: null, vitals: null, cpu: [], today: 0, linked: false, browserActive: false };
function applyActivity(e) {
  let run = OPS.runs.get(e.run);
  if (e.type === "run_start") { run = { run: e.run, text: e.text, channel: e.channel, profile: e.profile, started: e.ts, status: "running", steps: [] }; OPS.runs.set(e.run, run); }

function runsHtml() {

function gauge(canvas, pct, colorVar = "#39d0ff") {
  const g = canvas.getContext("2d"), W = canvas.width, H = canvas.height, r = W * 0.38;
  g.clearRect(0, 0, W, H); g.lineCap = "round"; g.lineWidth = W * 0.07;
  g.strokeStyle = "rgba(84,205,255,.14)"; g.beginPath(); g.arc(W / 2, H / 2, r, Math.PI * 0.75, Math.PI * 2.25); g.stroke();
  const col = pct > 85 ? "#ff5d6c" : pct > 65 ? "#ffb547" : colorVar;
  g.strokeStyle = col; g.shadowColor = col; g.shadowBlur = 10;
  g.beginPath(); g.arc(W / 2, H / 2, r, Math.PI * 0.75, Math.PI * 0.75 + Math.PI * 1.5 * Math.max(0, Math.min(1, pct / 100))); g.stroke();
  g.shadowBlur = 0; g.fillStyle = "#d6ecfb"; g.font = `600 ${W * 0.2}px "Chakra Petch", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(pct == null ? "—" : Math.round(pct) + "%", W / 2, H / 2 + 2);
}
function spark(canvas, data) {
  const g = canvas.getContext("2d"), W = canvas.width, H = canvas.height;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = "rgba(84,205,255,.08)"; g.lineWidth = 1;
  for (let y = 0; y <= 4; y++) { g.beginPath(); g.moveTo(0, y * H / 4); g.lineTo(W, y * H / 4); g.stroke(); }
  if (data.length < 2) return;
  const x = (i) => i / (60 - 1) * W, y = (v) => H - (v / 100) * (H - 4) - 2;
  const off = 60 - data.length;
  g.beginPath(); data.forEach((v, i) => i ? g.lineTo(x(i + off), y(v)) : g.moveTo(x(i + off), y(v)));
  g.strokeStyle = "#39d0ff"; g.lineWidth = 2; g.stroke();
  g.lineTo(x(59), H); g.lineTo(x(off), H); g.closePath();
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, "rgba(57,208,255,.3)"); grad.addColorStop(1, "rgba(57,208,255,0)");
  g.fillStyle = grad; g.fill();
  g.fillStyle = "#9df3ff"; g.beginPath(); g.arc(x(59), y(data[data.length - 1]), 3, 0, Math.PI * 2); g.fill();
}

  let loading = false;
  async function refresh(force) {
    if (loading && !force) return; loading = true;
    try {
      if (DEMO) { img.src = DEMO.src({ source: "browser" }); const st = DEMO.browser(); $("#b-title").textContent = st.title; if (!$("#b-url").matches(":focus")) $("#b-url").value = st.url; ov.classList.add("hidden"); return; }
      const st = await api("/api/browser/state");
      if (!st || !st.open) { img.removeAttribute("src"); ov.classList.remove("hidden"); ov.innerHTML = "<div><h2>Browser is closed</h2><p>Type an address above to open it, or ask Jarvis to look something up.</p></div>"; $("#b-title").textContent = ""; return; }
      ov.classList.add("hidden");
      if (!$("#b-url").matches(":focus")) $("#b-url").value = st.url;
      $("#b-title").textContent = `${st.title || ""} · ${st.tabs.length} tab${st.tabs.length === 1 ? "" : "s"}`;
      const r = await fetch(`/api/browser/screenshot?t=${Date.now()}`, { credentials: "same-origin" });
      if (r.status === 200) { const u = URL.createObjectURL(await r.blob()); const old = img.src; img.src = u; if (old.startsWith("blob:")) setTimeout(() => URL.revokeObjectURL(old), 2000); }
    } catch (e) { /* ignore */ } finally {
      loading = false;
      $("#b-driving").classList.toggle("hidden", !(OPS.browserDriving && Date.now() - OPS.browserDriving < 8000));
    }
  }
  $("#b-go").onclick = () => act({ action: "open", url: $("#b-url").value });
  $("#b-url").onkeydown = (e) => { if (e.key === "Enter") $("#b-go").click(); };

  el.querySelectorAll("[data-scroll]").forEach(b => b.onclick = () => act({ action: "scroll", dy: +b.dataset.scroll }));
  $("#b-send").onclick = () => { const t = $("#b-type").value; if (t) { act({ action: "type", text: t }); $("#b-type").value = ""; } };
  $("#b-type").onkeydown = (e) => { if (e.key === "Enter") $("#b-send").click(); };
  img.onclick = (e) => {
    const r = img.getBoundingClientRect();
    if (DEMO) return toast("Clicked the page", "On your Jarvis this clicks in his browser.");
    act({ action: "click", fx: (e.clientX - r.left) / r.width, fy: (e.clientY - r.top) / r.height });
  };
  refresh(true);
  viewTimer = setInterval(refresh, 1200);
};

  if (item.kind === "video") return `<video src="${esc(src)}" controls autoplay playsinline></video>`;
  if (item.kind === "audio") return `<audio src="${esc(src)}" controls autoplay></audio>`;

}

let camShare = null;
function grabFrame() {
  const video = $("#cam-video");
  const src = video && video.videoWidth ? video : null;
  const v = src || (camStream ? Object.assign(document.createElement("video"), { srcObject: camStream, muted: true }) : null);
  if (!v || !v.videoWidth) return null;
  const max = 1024, w = v.videoWidth, h = v.videoHeight, k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.75);
}
const shareVideo = document.createElement("video"); shareVideo.muted = true; shareVideo.playsInline = true;
async function shareTick(name) {
  if (!camStream) return stopShare();
  if (shareVideo.srcObject !== camStream) { shareVideo.srcObject = camStream; shareVideo.play().catch(() => {}); }
  const v = shareVideo; if (!v.videoWidth) return;
  const k = Math.min(1, 960 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement("canvas");
  c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k); c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);

}
function stopShare() {

}

        <div class="field"><label for="set-voice">Voice</label><select id="set-voice" ${browserVoice ? "disabled" : ""}>${VOICES.voices.map(v => `<option value="${esc(v.id)}" ${(voiceId || VOICES.default) === v.id ? "selected" : ""}>${esc(v.label)}</option>`).join("")}</select></div>
        <div class="row"><button class="btn primary" id="set-test">Test voice</button></div>
        <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="set-speak" ${voiceOn ? "checked" : ""}> Speak replies out loud</label>
      </div>
      <div class="card stack">
        <h2>Listening</h2>
        <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="set-convo" ${convoOn ? "checked" : ""}> Conversation mode: keep listening after each reply</label>
        <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="set-wake" ${wakeOn ? "checked" : ""} ${SR ? "" : "disabled"}> Wake word: say "Jarvis" to start ${SR ? "" : "(needs Chrome, Edge or Safari)"}</label>
        <div class="field"><label for="set-lang">Your accent / language</label><select id="set-lang">${[["en-GB", "English (UK)"], ["en-US", "English (US)"], ["en-SG", "English (Singapore)"], ["en-AU", "English (Australia)"], ["nl-NL", "Dutch"], ["th-TH", "Thai"]].map(([v, l]) => `<option value="${v}" ${micLang === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
        <p class="dim" style="margin:0;font-size:13px">Tip: tap the core to talk, tap again to stop. While he's speaking, tap it to interrupt.</p>
      </div>
      <div class="card stack">
        <h2>Account</h2>
        <p class="dim" style="margin:0">Signed in as ${esc(STATE.profile.name)} (${STATE.profile.role === "child" ? "tutor profile" : "owner"}).</p>
        <div class="row"><a class="btn" href="#family">Switch profile</a><button class="btn danger" id="set-logout">Sign out</button></div>
      </div>
    </div>`;
  $("#set-voice").onchange = (e) => { voiceId = e.target.value; pref.set("voiceId", voiceId); };
  $("#set-test").onclick = () => { ensureAudio(); speak(`Good ${new Date().getHours() < 12 ? "morning" : new Date().getHours() < 18 ? "afternoon" : "evening"}, ${STATE.profile.name}. All systems are running normally.`); };
  $("#set-speak").onchange = (e) => { voiceOn = e.target.checked; pref.set("voice", voiceOn); syncToggles(); };
  $("#set-convo").onchange = (e) => { convoOn = e.target.checked; pref.set("convo", convoOn); syncToggles(); };
  $("#set-wake").onchange = (e) => { wakeOn = e.target.checked; pref.set("wake", wakeOn); syncToggles(); if (wakeOn) resumeWake(); else pauseWake(); };
  $("#set-lang").onchange = (e) => { micLang = e.target.value; pref.set("lang", micLang); };
  $("#set-logout").onclick = async () => { await api("/api/logout", { body: {} }); location.reload(); };
};

/* ----- system / how it's built ----- */
RENDER.system = async () => {
  const el = viewEl("system");
  const s = await api("/api/system");
  const integ = s.integrations;
  const pill = (on, lbl) => `<span class="pill ${on ? "on" : "off"}"><span class="dot"></span>${lbl}</span>`;
  const MOD = { system: "Computer", memory: "Memory", knowledge: "Knowledge & teaching", expert: "Expert", tasks: "Tasks, reminders, automations", weather: "Weather", devices: "Devices & AV", kids: "Learning projects", comms: "Phone & email", browser: "Browser", documents: "Documents", media: "Screen & cameras", integrations: "Building systems", programs: "Programs" };
  el.innerHTML = head("How it's built", `Version ${esc(s.version)} · ${s.tool_count} tools · everyday model <span class="mono">${esc(s.model)}</span> · expert model <span class="mono">${esc(s.expert_model || "—")}</span>`,
    '<a class="btn" href="/api/backup" id="backup-btn">Download what Jarvis knows</a>') + `
    <div class="tiles">
      <div class="tile"><div class="n">${s.counts.memories}</div><div class="l">memories</div></div>
      <div class="tile"><div class="n">${s.counts.knowledge_sources}</div><div class="l">knowledge sources</div></div>
      <div class="tile"><div class="n">${s.counts.procedures}</div><div class="l">procedures</div></div>
      <div class="tile"><div class="n">${s.counts.open_tasks}</div><div class="l">open tasks</div></div>
      <div class="tile"><div class="n">${s.counts.automations}</div><div class="l">automations</div></div>
      <div class="tile"><div class="n">${s.tool_count}</div><div class="l">tools</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="section-title"><h2>Architecture</h2><div class="row" style="gap:6px">${pill(integ.claude_api, "Claude API")}${pill(s.web_search, "web search")}${pill(integ.voice, "voice")}${pill(integ.browser, "browser")}${pill(integ.phone, "phone")}${pill(integ.home_assistant, "Home Assistant")}${pill(integ.cameras, "cameras")}${pill(integ.email, "email")}${pill(integ.integrations > 0, `${integ.integrations || 0} integrations`)}${pill(integ.watched_folders > 0, `${integ.watched_folders} watched folders`)}</div></div>
      <div class="arch">
        <div class="layer"><div class="lbl">You talk to him</div><div class="boxes">
          <div class="box"><b>Voice</b><span>wake word, speech recognition, neural voice</span></div>
          <div class="box"><b>This app</b><span>core, operations, integrations, programs, browser, media, cameras</span></div>
          <div class="box"><b>Phone</b><span>Vapi number → Jarvis brain</span></div>
          <div class="box"><b>Terminal</b><span>jarvis chat · ask · teach</span></div></div></div>
        <div class="flow">▼</div>
        <div class="layer"><div class="lbl">Brain</div><div class="boxes">
          <div class="box core"><b>Agent loop</b><span>Claude decides, calls tools, repeats until done</span></div>
          <div class="box core"><b>Context</b><span>persona, your rules, memories, procedures, recalled knowledge</span></div>
          <div class="box core"><b>Live activity</b><span>every step streams to this app</span></div>
          <div class="box core"><b>Profiles</b><span>${s.profiles.map(p => esc(p.name)).join(" · ")}</span></div></div></div>
        <div class="flow">▼</div>
        <div class="layer"><div class="lbl">Hands</div><div class="boxes">${Object.keys(s.tools).map(k => `<div class="box"><b>${esc(MOD[k] || k)}</b><span>${s.tools[k].length} tools</span></div>`).join("")}</div></div>
        <div class="flow">▼</div>
        <div class="layer"><div class="lbl">On your machine</div><div class="boxes">
          <div class="box"><b>Memory DB</b><span>facts, tasks, reminders, automations</span></div>
          <div class="box"><b>Knowledge index</b><span>full-text search of your documents</span></div>
          <div class="box"><b>Browser profile</b><span>sites stay logged in</span></div>
          <div class="box"><b>Nightly backup</b><span>database + readable export</span></div></div></div>
        <div class="flow">▼</div>
        <div class="layer"><div class="lbl">Outside services</div><div class="boxes">
          <div class="box"><b>Anthropic</b><span>Claude models + web search</span></div>
          <div class="box"><b>Vapi + Twilio</b><span>phone calls</span></div>
          <div class="box"><b>Cloudflare Tunnel</b><span>secure public address</span></div>
          <div class="box"><b>Building systems</b><span>Crestron · Lutron · Modbus · REST · TCP</span></div>
          <div class="box"><b>Home Assistant</b><span>lights, climate, media, cameras</span></div></div></div>
      </div>
    </div>
    <div class="tools-grid">${Object.entries(s.tools).map(([k, list]) => `<div class="card"><h3>${esc(MOD[k] || k)}</h3><ul>${list.map(t => `<li><code>${esc(t.name)}</code> ${esc(t.description)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  if (DEMO) $("#backup-btn").onclick = (e) => { e.preventDefault(); toast("Available on your Jarvis", "Downloads a readable copy of everything he knows."); };
};

/* ----- more (phones) ----- */
RENDER.more = async () => {
  const el = viewEl("more");
  const child = STATE.profile.role === "child";
  const tabIds = Array.from(document.querySelectorAll("#tabbar [data-nav]")).map(a => a.dataset.nav);
  const items = VIEWS.filter(([id]) => !tabIds.includes(id) && !(child && OWNER_ONLY.has(id)));
  el.innerHTML = head("More", "") + `<div class="card list">${items.map(([id, lbl]) => `<a class="item" href="#${id}" style="text-decoration:none;color:var(--ink);align-items:center"><span style="width:20px;height:20px;color:var(--accent)">${icon(id)}</span><span class="body">${esc(lbl)}</span><span class="dim">›</span></a>`).join("")}</div>`;
};

/* ================= boot ================= */
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#login-password").focus(); if (!window._loginReactor) window._loginReactor = new Reactor($("#login-reactor")); }
async function boot(again) {
  try { STATE = await api("/api/state"); } catch (e) { return showLogin(); }
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  if (!reactor) reactor = new Reactor($("#reactor"));
  try { const sys = await api("/api/system"); STATE.integrations = { ...sys.integrations, cameras: (await api("/api/dashboard")).cameras.length > 0 }; } catch (e) { STATE.integrations = {}; }
  try { VOICES = await api("/api/voices"); } catch (e) { /* defaults */ }
  if (again) $("#messages").innerHTML = "";
  buildNav(); syncToggles();
  mountOps($("#ops"));
  route();
  await loadHistory();
  idle();
  if (!again) {
    listen();
    pollDashboard(); pollVitals();
    setInterval(pollDashboard, 15000); setInterval(pollVitals, 3000); setInterval(refreshFeeds, 5000);
    (STATE.alerts || []).slice(-3).forEach(a => addMsg("alert", `<b>${esc(a.title)}</b> · ${esc(a.text)}`));
    if (wakeOn) resumeWake();
  }
}
function tickClock() { const d = new Date(); $("#clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
setInterval(tickClock, 1000); tickClock();

$("#login-form").onsubmit = async (e) => {
  e.preventDefault(); $("#login-err").textContent = "";
  try { await api("/api/login", { body: { password: $("#login-password").value } }); boot(); }
  catch (err) { $("#login-err").textContent = err.message; }
};
$("#chat-form").onsubmit = (e) => { e.preventDefault(); ensureAudio(); const t = $("#chat-input").value; $("#chat-input").value = ""; autosize(); send(t); };
const autosize = () => { const t = $("#chat-input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; };
$("#chat-input").addEventListener("input", autosize);
$("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#chat-form").requestSubmit(); } });
$("#mic").onclick = () => { ensureAudio(); startListening(); };
$("#reactor").onclick = () => { ensureAudio(); if (speaking) return stopSpeaking(); startListening(); };
$("#voice-toggle").onclick = () => { voiceOn = !voiceOn; pref.set("voice", voiceOn); if (!voiceOn) stopSpeaking(); syncToggles(); };
$("#convo-toggle").onclick = () => { convoOn = !convoOn; pref.set("convo", convoOn); syncToggles(); toast(convoOn ? "Conversation mode on" : "Conversation mode off", convoOn ? "I'll keep listening after each reply." : ""); };
$("#wake-toggle").onclick = () => {
  if (!SR || DEMO) return toast("Wake word", DEMO ? "Works on your own Jarvis in Chrome, Edge or Safari." : "Needs Chrome, Edge or Safari.");
  wakeOn = !wakeOn; pref.set("wake", wakeOn); syncToggles(); if (wakeOn) { ensureAudio(); resumeWake(); toast("Wake word on", 'Say "Jarvis, …" any time.'); } else pauseWake(); idle();
};
$("#reset-btn").onclick = async () => { await api("/api/reset", { body: {} }); $("#messages").innerHTML = ""; addMsg("system", "— new conversation —"); };
$("#teach-toggle").onclick = async () => {
  const on = STATE.mode !== "teach";
  const r = await api("/api/teach", { body: { on } });
  setTeach(r.mode === "teach");
  addMsg("system", on ? "— teach mode: Jarvis will interview you —" : "— teach mode off —");
  if (r.kickoff) send(r.kickoff, { hidden: true });
};
$("#who").onclick = () => { location.hash = "#family"; };
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && speaking) stopSpeaking(); });
if (DEMO) $("#demo-banner").classList.remove("hidden");
boot();
</script>
