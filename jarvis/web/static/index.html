<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a12">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a quiet instrument panel — left rail (bottom tabs on phones), one working
   surface per view, Jarvis's orb as the single glowing element that shows his state. */
:root {
  --bg: #060a12;
  --panel: #0c1422;
  --panel-2: #111c2e;
  --line: #1c2a40;
  --ink: #d9e6f5;
  --ink-dim: #8193ab;
  --accent: #46c8f5;
  --accent-ink: #04121c;
  --warn: #f2b14a;
  --bad: #ef6b6b;
  --good: #5ad19a;
  --font-display: "Chakra Petch", "Rajdhani", ui-sans-serif, system-ui, sans-serif;
  --font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.dim { color: var(--ink-dim); }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
#app { display: grid; grid-template-columns: 232px 1fr; flex: 1; min-height: 0; }
.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 12px; gap: 18px; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand .name { font-family: var(--font-display); font-size: 20px; letter-spacing: .18em; }
.brand .ver { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
.nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink-dim); text-decoration: none; font-weight: 500; }
.nav a svg { width: 18px; height: 18px; flex: none; }
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a.active { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.nav .sep { height: 1px; background: var(--line); margin: 8px 6px; }
.who { margin-top: auto; text-align: left; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 600; }
.who .meta { min-width: 0; flex: 1; }
.who .meta div:first-child { font-weight: 600; }
main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 24px clamp(16px, 4vw, 40px) 40px; }
.view.chat-view { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head p { margin: 4px 0 0; color: var(--ink-dim); max-width: 62ch; }
.tabbar { display: none; }

/* ---------- controls ---------- */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: #2c4262; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.icon { padding: 8px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; color: var(--ink-dim); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; }
input[type=text], input[type=password], input[type=search], input[type=url], input[type=datetime-local], input[type=date], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 84px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.row > .field { flex: 1 1 180px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap; }
.pill.on { color: var(--good); border-color: #1f4a39; }
.pill.off { color: var(--ink-dim); }
.pill.warn { color: var(--warn); border-color: #4b3a1c; }
.pill.accent { color: var(--accent); border-color: #1b4560; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .actions { display: flex; gap: 6px; flex: none; }
.empty { color: var(--ink-dim); padding: 18px 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .n { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 12px; color: var(--ink-dim); }
.section-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.cat { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 2px; }
.cat.core { color: var(--warn); }

/* ---------- orb ---------- */
.orb { --size: 36px; width: var(--size); height: var(--size); border-radius: 50%; position: relative; flex: none;
  background: radial-gradient(circle at 50% 42%, #eafcff 0 8%, #74dcff 22%, #1b7fb3 55%, #082238 78%); box-shadow: 0 0 18px rgba(70, 200, 245, .35); }
.orb::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1px dashed rgba(70, 200, 245, .45); }
.orb.big { --size: 64px; }
.orb.thinking::after { animation: spin 2.4s linear infinite; border-style: dashed; border-color: var(--accent); }
.orb.listening { box-shadow: 0 0 0 0 rgba(70, 200, 245, .6); animation: pulse 1.2s ease-out infinite; }
.orb.speaking { animation: breathe .9s ease-in-out infinite alternate; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { to { box-shadow: 0 0 0 18px rgba(70, 200, 245, 0); } }
@keyframes breathe { from { filter: brightness(.9); } to { filter: brightness(1.35); transform: scale(1.04); } }
@media (prefers-reduced-motion: reduce) { .orb, .orb::after { animation: none !important; } }

/* ---------- chat ---------- */
.chat-head { display: flex; align-items: center; gap: 14px; padding: 14px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); background: var(--panel); }
.chat-head .status { flex: 1; min-width: 0; }
.chat-head .status .t { font-family: var(--font-display); font-size: 18px; letter-spacing: .06em; }
.chat-head .status .s { font-size: 13px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.toggle { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: 13px; color: var(--ink-dim); }
.toggle[aria-pressed="true"] { color: var(--accent); border-color: #1b4560; background: #0a2232; }
.toggle.teach[aria-pressed="true"] { color: var(--warn); border-color: #4b3a1c; background: #241b0b; }
.messages { flex: 1; overflow-y: auto; padding: 20px clamp(16px, 4vw, 40px); display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: min(760px, 92%); }
.msg.user { align-self: flex-end; background: #13304a; border: 1px solid #1d4565; padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; display: flex; gap: 12px; }
.msg.bot .orb { --size: 26px; margin-top: 2px; }
.msg.bot .orb::after { inset: -4px; }
.msg.bot .content { min-width: 0; flex: 1; }
.msg.system { align-self: center; font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); }
.msg.alert { align-self: center; border: 1px solid #4b3a1c; background: #1c160b; color: #f6d9a5; padding: 8px 12px; border-radius: 10px; font-size: 14px; }
.activity { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.act { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); display: flex; gap: 8px; align-items: baseline; }
.act .k { color: var(--accent); }
.act > span:nth-child(2) { flex: none; }
.act .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md h1, .md h2, .md h3 { margin: 14px 0 6px; }
.md code { font-family: var(--font-mono); font-size: 13px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; margin-bottom: 10px; }
.md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.typing { display: inline-flex; gap: 4px; padding: 6px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px clamp(16px, 4vw, 40px) calc(12px + env(safe-area-inset-bottom)); }
.composer form { display: flex; gap: 8px; align-items: flex-end; max-width: 920px; margin: 0 auto; }
.composer textarea { min-height: 44px; max-height: 180px; resize: none; padding: 11px 12px; }
.mic.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
.suggest { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 920px; margin: 0 auto 10px; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; white-space: nowrap; font-size: 13px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink-dim); cursor: pointer; }
.suggest button:hover { color: var(--ink); }

/* ---------- architecture ---------- */
.arch { display: grid; gap: 10px; }
.layer { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: stretch; }
.layer .lbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-dim); padding-top: 10px; }
.boxes { display: flex; flex-wrap: wrap; gap: 8px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; flex: 1 1 140px; }
.box b { display: block; font-weight: 600; font-size: 14px; }
.box span { font-size: 12px; color: var(--ink-dim); }
.box.core { border-color: #1b4560; background: #0a1c2b; }
.flow { text-align: center; color: var(--ink-dim); font-family: var(--font-mono); font-size: 12px; margin-left: 132px; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tools-grid ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.tools-grid li { font-size: 13px; color: var(--ink-dim); }
.tools-grid li code { font-family: var(--font-mono); font-size: 12px; color: var(--ink); }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(2, 5, 10, .72); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { width: min(520px, 100%); max-height: 90%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog.approve { border-color: #4b3a1c; box-shadow: 0 0 0 1px #4b3a1c, 0 20px 60px rgba(0,0,0,.5); }
.dialog .what { font-family: var(--font-mono); font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.dialog .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.dialog.wide { width: min(860px, 100%); }
.doc-text { white-space: pre-wrap; font-size: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 60vh; overflow-y: auto; }
#toasts { position: fixed; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100% - 32px)); }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); font-size: 14px; }
.toast.alert { border-left-color: var(--warn); }
.toast.error { border-left-color: var(--bad); }
.toast b { display: block; margin-bottom: 2px; }

/* ---------- login ---------- */
#login { flex: 1; display: grid; place-items: center; padding: 16px; }
#login form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
#login .name { font-family: var(--font-display); font-size: 28px; letter-spacing: .3em; }
#login .err { color: var(--bad); min-height: 1.5em; font-size: 14px; }
.demo-banner { background: #1c160b; color: #f6d9a5; border-bottom: 1px solid #4b3a1c; padding: 6px 16px; font-size: 13px; text-align: center; }

/* ---------- phones ---------- */
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .rail { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; font-size: 11px; color: var(--ink-dim); text-decoration: none; }
  .tabbar a svg { width: 21px; height: 21px; }
  .tabbar a.active { color: var(--accent); }
  .layer { grid-template-columns: 1fr; gap: 4px; }
  .layer .lbl { padding-top: 0; }
  .flow { margin-left: 0; }
  .chat-head { padding-top: calc(12px + env(safe-area-inset-top)); }
  .view { padding-top: calc(20px + env(safe-area-inset-top)); }
  .view.chat-view { padding-top: 0; }
  .composer { padding-bottom: 12px; }
  .msg { max-width: 100%; }
  #toasts { top: calc(12px + env(safe-area-inset-top)); left: 16px; right: 16px; max-width: none; }
  .chat-head { flex-wrap: wrap; gap: 10px 12px; }
  .chat-head .orb.big { --size: 40px; }
  .chat-head .toggles { width: 100%; flex-wrap: nowrap; overflow-x: auto; }
  .toggle { flex: none; }
  .tile { padding: 10px 12px; } .tile .n { font-size: 22px; }
  .view-head .row { width: 100%; }
}
</style>
</head>
<body>
<div id="demo-banner" class="demo-banner hidden">Demo with sample data. On your own Jarvis, every action here is real.</div>

<!-- ============ login ============ -->
<section id="login" class="hidden">
  <form id="login-form" autocomplete="on">
    <div class="orb big" aria-hidden="true"></div>
    <div class="name">JARVIS</div>
    <div class="field" style="width:100%">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit" style="width:100%">Sign in</button>
    <div class="err" id="login-err" role="alert"></div>
  </form>
</section>

<!-- ============ app ============ -->
<div id="app" class="hidden">
  <aside class="rail">
    <div class="brand"><div class="orb" id="rail-orb" aria-hidden="true"></div><div><div class="name" id="brand-name">JARVIS</div><div class="ver" id="brand-ver"></div></div></div>
    <nav class="nav" id="nav"></nav>
    <button class="who" id="who" type="button" title="Switch profile">
      <div class="avatar" id="who-avatar">A</div>
      <div class="meta"><div id="who-name">—</div><div class="dim mono" id="who-role"></div></div>
    </button>
  </aside>
  <main>
    <!-- chat -->
    <section class="view chat-view" data-view="chat">
      <div class="chat-head">
        <div class="orb big" id="orb" aria-hidden="true"></div>
        <div class="status"><div class="t" id="chat-title">Jarvis</div><div class="s" id="chat-status">Online</div></div>
        <div class="toggles">
          <button class="toggle teach" id="teach-toggle" type="button" aria-pressed="false" title="Jarvis interviews you and saves what he learns">Teach mode</button>
          <button class="toggle" id="speak-toggle" type="button" aria-pressed="false" title="Read replies aloud">Speak replies</button>
          <button class="toggle" id="reset-btn" type="button" title="Start a new conversation">New chat</button>
        </div>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="composer">
        <div class="suggest" id="suggest"></div>
        <form id="chat-form">
          <button class="btn icon mic" id="mic" type="button" title="Speak to Jarvis" aria-label="Speak to Jarvis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <label for="chat-input" class="hidden">Message</label>
          <textarea id="chat-input" rows="1" placeholder="Message Jarvis…"></textarea>
          <button class="btn primary" id="send" type="submit">Send</button>
        </form>
      </div>
    </section>

    <section class="view hidden" data-view="memory"></section>
    <section class="view hidden" data-view="knowledge"></section>
    <section class="view hidden" data-view="procedures"></section>
    <section class="view hidden" data-view="tasks"></section>
    <section class="view hidden" data-view="automations"></section>
    <section class="view hidden" data-view="phone"></section>
    <section class="view hidden" data-view="family"></section>
    <section class="view hidden" data-view="system"></section>
    <section class="view hidden" data-view="more"></section>
  </main>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="overlay-root"></div>
<div id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ================= icons ================= */
const I = {
  chat: '<path d="M4 5h16v11H8l-4 4z"/>',
  memory: '<path d="M12 3a7 7 0 0 0-4 12.7V19h8v-3.3A7 7 0 0 0 12 3zM9 22h6"/>',
  knowledge: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3"/><path d="M20 4v14h-7"/>',
  procedures: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  tasks: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/>',
  automations: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
  phone: '<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>',
  family: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M3 20a6 6 0 0 1 12 0M14 20a4 4 0 0 1 7 0"/>',
  system: '<rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString([], {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}); };
let STATE = null;

function md(src) {
  const blocks = [];
  let s = String(src ?? "").replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => { blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(inline).join("<br>")}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.type}>${list.items.map(i => `<li>${inline(i)}</li>`).join("")}</${list.type}>`); list = null; } };
  const lines = s.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const ph = line.match(/^\u0000(\d+)\u0000$/);
    if (ph) { flushPara(); flushList(); out.push(blocks[+ph[1]]); continue; }
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      flushPara(); flushList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      let html = `<table><thead><tr>${cells(line).map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>`;
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { html += `<tr>${cells(lines[i]).map(c => `<td>${c}</td>`).join("")}</tr>`; i++; }
      i--; out.push(html + "</tbody></table>"); continue;
    }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    if (h) { flushPara(); flushList(); out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`); continue; }
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) { flushPara(); const type = ul ? "ul" : "ol"; if (!list || list.type !== type) { flushList(); list = {type, items: []}; } list.items.push((ul || ol)[1]); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("");
}

function toast(title, text = "", kind = "") {
  const el = document.createElement("div");
  el.className = `toast ${kind}`;
  el.innerHTML = `<b>${esc(title)}</b>${esc(text)}`;
  $("#toasts").appendChild(el);

}

function dialog(html, cls = "") {
  const root = $("#overlay-root");
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="dialog ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov && !cls.includes("approve")) close(); });
  const first = ov.querySelector("input, textarea, select, button");
  if (first) setTimeout(() => first.focus(), 30);

/* ================= API (real server, or the demo backend) ================= */
const DEMO = window.JARVIS_DEMO || null;
async function api(path, opts = {}) {
  if (DEMO) return DEMO.api(path, opts);
  const init = { method: opts.method || (opts.body !== undefined || opts.form ? "POST" : "GET"), credentials: "same-origin", headers: {} };
  if (opts.form) init.body = opts.form;
  else if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const r = await fetch(path, init);
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Please sign in."); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.detail) || `Request failed (${r.status})`);
  return data;
}

async function chatStream(text, voice, onEvent) {
  if (DEMO) return DEMO.chat(text, voice, onEvent);
  const r = await fetch("/api/chat", { method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ text, voice }) });
  if (r.status === 401) { showLogin(); return; }
  if (!r.ok || !r.body) throw new Error(`Chat failed (${r.status})`);
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split("\n").find(l => l.startsWith("data: "));
      if (line) onEvent(JSON.parse(line.slice(6)));
    }
  }
}

function listenAlerts() {
  if (DEMO) { DEMO.onAlert = onAlert; return; }
  try {
    const es = new EventSource("/api/events");
    es.onmessage = (m) => { const e = JSON.parse(m.data); if (e.type === "alert") onAlert(e); };
  } catch (e) { /* no live alerts */ }
}
function onAlert(e) {
  toast(e.title, e.text, "alert");
  addMsg("alert", `<b>${esc(e.title)}</b> · ${esc(e.text)}`);
}

async function send(text, opts = {}) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; $("#send").disabled = true;
  if (!opts.hidden) addMsg("user", esc(text));
  const bot = addMsg("bot", '<span class="typing"><i></i><i></i><i></i></span>');
  const act = $(".activity", bot), body = $(".md", bot);
  setOrb("thinking", "Thinking…");
  try {
    await chatStream(text, !!opts.voice, (e) => {
      if (e.type === "tool") { act.insertAdjacentHTML("beforeend", toolLine(e.name, e.args)); setOrb("thinking", TOOL_LABEL[e.name] || "Working…"); scrollDown(); }
      else if (e.type === "confirm") askApproval(e);
      else if (e.type === "confirm_result") act.insertAdjacentHTML("beforeend", `<div class="act"><span class="k">${e.approved ? "✓" : "✕"}</span><span>${e.approved ? "You approved it" : "You declined it"}</span></div>`);
      else if (e.type === "reply") { body.innerHTML = md(e.text); if (e.mode) setTeach(e.mode === "teach"); if (speakOn || opts.voice) speak(e.text); }
      else if (e.type === "error") { body.innerHTML = `<p style="color:var(--bad)">${esc(e.text)}</p>`; }
    });
  } catch (err) {
    body.innerHTML = `<p style="color:var(--bad)">${esc(err.message)}</p>`;
  } finally {
    busy = false; $("#send").disabled = false;
    if (!$("#orb").classList.contains("speaking")) setOrb("", STATE && STATE.mode === "teach" ? "Teach mode — answer my questions" : "Online");
    scrollDown();
  }
}

/* ----- voice ----- */
let audioEl = null;
function speak(text) {
  const plain = String(text).replace(/```[\s\S]*?```/g, "").replace(/[*_#`>|]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").slice(0, 1500);
  const done = () => setOrb("", "Online");
  setOrb("speaking", "Speaking…");
  if (!DEMO) {
    fetch(`/api/tts?text=${encodeURIComponent(plain)}`, { credentials: "same-origin" }).then(r => {
      if (!r.ok) throw new Error("no server voice");
      return r.blob();
    }).then(b => {
      audioEl = new Audio(URL.createObjectURL(b));
      audioEl.onended = done; audioEl.play().catch(() => browserSpeak(plain, done));
    }).catch(() => browserSpeak(plain, done));
  } else browserSpeak(plain, done);
}
function browserSpeak(text, done) {
  if (!("speechSynthesis" in window)) return done();
  const u = new SpeechSynthesisUtterance(text);
  const v = speechSynthesis.getVoices().find(v => /en-GB/i.test(v.lang) && /male|daniel|ryan|george/i.test(v.name)) || speechSynthesis.getVoices().find(v => /en-GB/i.test(v.lang));
  if (v) u.voice = v;
  u.onend = done; u.onerror = done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

let recognizing = false, rec = null, mediaRec = null;
async function toggleMic() {
  const btn = $("#mic");
  if (DEMO) return toast("Voice works on your own Jarvis", "In this demo, type your message instead.");
  if (recognizing) { if (rec) rec.stop(); if (mediaRec) mediaRec.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    rec = new SR(); rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = false;
    rec.onstart = () => { recognizing = true; btn.classList.add("rec"); setOrb("listening", "Listening…"); };
    rec.onresult = (ev) => { $("#chat-input").value = Array.from(ev.results).map(r => r[0].transcript).join(""); };
    rec.onend = () => { recognizing = false; btn.classList.remove("rec"); setOrb("", "Online"); const t = $("#chat-input").value; if (t.trim()) { $("#chat-input").value = ""; send(t, { voice: true }); } };
    rec.onerror = (e) => toast("Microphone", e.error === "not-allowed" ? "Allow microphone access in your browser settings." : e.error, "error");
    rec.start();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = (e) => chunks.push(e.data);
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      recognizing = false; btn.classList.remove("rec"); setOrb("thinking", "Transcribing…");
      const form = new FormData(); form.append("audio", new Blob(chunks, { type: mediaRec.mimeType }), "speech.webm");
      try { const { text } = await api("/api/transcribe", { form }); if (text) send(text, { voice: true }); else setOrb("", "I didn't catch that"); }
      catch (err) { setOrb("", "Online"); toast("Couldn't transcribe", err.message, "error"); }
    };
    mediaRec.start(); recognizing = true; btn.classList.add("rec"); setOrb("listening", "Listening… tap again to stop");
  } catch (err) { toast("Microphone unavailable", "Allow microphone access, or type instead.", "error"); }
}

async function switchProfile(id, pin) {
  const r = await api("/api/profile", { body: { id, pin } }).catch(err => { toast("Couldn't switch", err.message, "error"); return null; });
  if (!r) return;
  if (r.pin_required) {
    const d = dialog(`<h2>Enter the PIN</h2><p class="dim" style="margin:0">Switching to the owner profile needs the PIN.</p><div class="field"><label for="pin-in">PIN</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off"></div><div class="btns"><button class="btn" data-x>Cancel</button><button class="btn primary" data-s>Unlock</button></div>`);
    $("[data-x]", d.el).onclick = d.close;
    const go = () => { const v = $("#pin-in", d.el).value; d.close(); switchProfile(id, v); };
    $("[data-s]", d.el).onclick = go; $("#pin-in", d.el).onkeydown = (e) => { if (e.key === "Enter") go(); };
    return;
  }
  toast(r.message || "Switched");
  await boot(true);
}

};

/* ================= boot ================= */
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#login-password").focus(); }
async function boot(again) {
  try { STATE = await api("/api/state"); } catch (e) { return showLogin(); }
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  buildNav(); route();
  await loadHistory();
  if (!again) { listenAlerts(); (STATE.alerts || []).slice(-3).forEach(a => addMsg("alert", `<b>${esc(a.title)}</b> · ${esc(a.text)}`)); }
}

$("#login-form").onsubmit = async (e) => {
  e.preventDefault(); $("#login-err").textContent = "";
  try { await api("/api/login", { body: { password: $("#login-password").value } }); boot(); }
  catch (err) { $("#login-err").textContent = err.message; }
};
$("#chat-form").onsubmit = (e) => { e.preventDefault(); const t = $("#chat-input").value; $("#chat-input").value = ""; autosize(); send(t); };
const autosize = () => { const t = $("#chat-input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; };
$("#chat-input").addEventListener("input", autosize);
$("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#chat-form").requestSubmit(); } });
$("#mic").onclick = toggleMic;
$("#speak-toggle").setAttribute("aria-pressed", speakOn ? "true" : "false");
$("#speak-toggle").onclick = () => { speakOn = !speakOn; $("#speak-toggle").setAttribute("aria-pressed", String(speakOn)); try { localStorage.setItem("jarvis.speak", speakOn ? "1" : "0"); } catch (e) { /* ignore */ } if (!speakOn) { speechSynthesis && speechSynthesis.cancel(); if (audioEl) audioEl.pause(); setOrb("", "Online"); } };
$("#reset-btn").onclick = async () => { await api("/api/reset", { body: {} }); $("#messages").innerHTML = ""; addMsg("system", "New conversation"); };
$("#teach-toggle").onclick = async () => {
  const on = STATE.mode !== "teach";
  const r = await api("/api/teach", { body: { on } });
  setTeach(r.mode === "teach");
  addMsg("system", on ? "Teach mode on: Jarvis will interview you and save what he learns" : "Teach mode off");
  if (r.kickoff) send(r.kickoff, { hidden: true });
};
$("#who").onclick = () => { location.hash = "#family"; };
window.addEventListener("hashchange", route);
if (DEMO) $("#demo-banner").classList.remove("hidden");
boot();
</script>
</body>
</html>
