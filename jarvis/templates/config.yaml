browser:
  mode: jarvis                    # jarvis = Jarvis's own Chrome window with a saved profile (log in once)
                                  # cdp    = attach to a Chrome you started with --remote-debugging-port=9222
  headless: false                 # keep the window visible so you can watch and take over
  channel: ""                     # "chrome" to drive your installed Google Chrome instead of Chromium

knowledge:
  # Folders Jarvis keeps learning from automatically (new/changed files re-read, deleted ones
  # forgotten). A SharePoint/OneDrive library synced to your Mac works well here.
  watch_folders: []
  #  - path: ~/Library/CloudStorage/OneDrive-WaveAVI/Engineering
  #    topic: engineering
  #  - path: ~/Documents/Datasheets
  #    topic: datasheets
  rescan_minutes: 30
  auto_recall: true               # pull relevant excerpts into every request automatically
  auto_recall_results: 4
  max_file_mb: 25

backup:
  enabled: true                   # nightly copy of everything Jarvis knows
  time: "03:15"
  folder: ""                      # default ~/.jarvis/backups — a OneDrive folder gives off-machine copies
  keep: 14

safety:
  confirm_shell: true             # ask before every shell command (strongly recommended)
  confirm_ha_domains: [lock, alarm_control_panel]
  confirm_device_actions: false   # ask before HTTP/TCP device commands
  shell_timeout: 60

home_assistant:
  url: ""                         # e.g. http://homeassistant.local:8123
  token_env: HA_TOKEN             # long-lived access token, set in .env
  verify_ssl: true

devices:
