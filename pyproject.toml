[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.3.0"
description = "Jarvis — a personal desktop AI assistant powered by Claude"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "apscheduler>=3.10,<4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "psutil>=5.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
]

[project.optional-dependencies]
voice = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "openwakeword>=0.4",
    "onnxruntime>=1.16",
    "edge-tts>=6.1",
    "pyttsx3>=2.90",
]
dev = ["pytest>=7", "reportlab>=4"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
